# SPARMVET_VIZ Data Analysis Recipe Structural Standard (Appendix)
# Authority: ADR-011, ADR-024, ADR-031
# This file serves as the official structural source of truth for all pipeline data analysis recipes.

basename_mirroring_mandate:
  rule: "A main data analysis recipe file (e.g., main.yaml) MUST organize its !include components within a directory matching its exact basename (e.g., main/)."
  level: "Same level as the main data analysis recipe file."

directory_taxonomy:
  info: "The top-level metadata block (free-form; label is required). A gallery example classifies itself with the taxonomy key of the plot entry, not here."
  input_fields: "Defines the columns that are read (keys: type, original_name, label, is_entity_key, null_values, strip). type is a Polars type name and is required."
  wrangling: "Defines Tier 1/Tier 2 transformations for individual data sources."
  join: "Contains the steps file(s) (tier1, tier2) for joining multiple ingredients into a collection. The published columns are the last step of tier1 (polars_select or polars_drop). Top-level data analysis recipe key: joins:."
  plots: "Contains visualization spec files for analysis_groups. Each file has a single 'spec:' root key."

constructor_standard:
  engine: "PyYAML with custom !include support via ConfigManager."
  relative_path: "Paths in !include must be relative to the data analysis recipe file."
  auto_unnesting: "ConfigManager auto-unnests redundant wrapper keys (e.g., a file with root key 'spec:' included under 'spec:' is flattened automatically)."

yaml_resilience:
  reserved_words: "The keys 'on', 'yes', 'no', 'true', 'false' are YAML reserved words (boolean). Always quote them."
  quoting_policy: "ALWAYS quote join keys: write 'on': not on:. 'on' unquoted is parsed as boolean True and silently corrupts join steps."
  shorthand_prohibition: "NEVER use action-name-as-key shorthand (e.g., '- polars_join: {...}'). ALL steps must use the 'action:' key. The checker refuses a step without it."

canonical_steps_syntax:
  mandatory_key: "Every step MUST have an 'action:' key naming a registered action (polars_<name>, modif_<name> or step_<name>). Nothing a step needs is a hidden default: a parameter that changes the result is written."
  join_step:
    correct: "- action: polars_join\n  right_ingredient: <dataset_id>\n  'on': [<column>]\n  how: inner\n  maintain_order: left_right"
    wrong_alias: "dataset_id: (FORBIDDEN — use right_ingredient:)"
    wrong_key: "on: (FORBIDDEN unquoted — YAML parses as True); 'on' takes a list"
  with_columns_step:
    correct: "- action: polars_with_columns\n  named_exprs:\n    new_col_name: \"pl.col('src').str.strip_chars()\""
    rule: "One mapping column: formula; all formulas of one step see the table as it was before the step (as in Polars). mutate and add_constant are removed."
  cast_step:
    correct: "- action: polars_cast\n  columns: [Year]\n  dtype: String"
    note: "A float to integer cast that would drop decimals stops and names the value; round in a separate polars_round step first."
  sort_step:
    correct: "- action: polars_sort\n  by: [Year, Source, Country]\n  maintain_order: true"
  select_step:
    correct: "- action: polars_select\n  exprs: [sample_id, gene, Country]"
    note: "The published columns of a table are its last tier1 step (polars_select or polars_drop). final_contract and output_fields do not exist any more."

analysis_groups_structure:
  description: "Top-level key in master data analysis recipe. Defines groups and plots rendered in the Home Theater."
  note: "This is the ONLY authoring format for plots. A flat 'plots:' key at the data analysis recipe root is refused."
  format: |
    analysis_groups:
      <group_id>:                         # snake_case, no spaces, no emoji
        label: "Human-readable group name"
        plots:
          <plot_id>:                      # snake_case; GLOBALLY UNIQUE across all data analysis recipes
            label: "Human-readable plot name"
            spec: !include <basename>/plots/<plot_id>.yaml
  plot_defaults_block: |
    # Optional data analysis recipe-level defaults applied to every plot (L2 in five-tier cascade).
    # Individual plot specs may override any key (L4 wins over L2).
    # Unknown keys are refused by the data analysis recipe checker (PD01).
    # Authoritative schema: rules_data_analysis_recipe_structure.md §10 / plot_config_cascade.md §7a.
    #
    # palette: (BP-COLOR-3) — named palette applied as fill/colour scale to every plot.
    #   Resolution order: plot-level palette > plot_defaults.palette > matplotlib default.
    #   Value: a) deployment palette from config/palettes.yaml → scale_*_manual (hex list)
    #          b) matplotlib name (e.g. "Blues", "viridis") → scale_*_brewer / scale_*_viridis_d
    #   Only injected for aesthetics in the plot mapping (fill / color).
    #   Never injected when data analysis recipe already declares scale_fill_* or scale_color_* layer.
    #
    plot_defaults:
      palette: nvi_official              # Named palette from config/palettes.yaml (or matplotlib)
      theme: theme_light                 # Registered theme component name (e.g. theme_bw)
      default_font_family: "Liberation Sans"  # plotnine font family default
      facet_panel_spacing: 0.1          # float 0–1; plotnine default 0.05
      legend_position: "right"          # "right" | "top" | "bottom" | "left" | "none"
      optimisation:                     # All default false except auto_axis_text
        auto_axis_text: true
        density_jitter: false
        panel_spacing: false
        legend_ncol: false

  plot_spec_file_format: |
    # Grammar-of-graphics format (ADR-083); factory_id is removed:
    spec:
      target_dataset: <assembly_id>      # Must match a joins key
      mapping:
        x: <column>
        fill: <column>
        facet_by: <column>               # Optional
      palette: nvi_official              # Optional — overrides plot_defaults.palette for this plot
      theme: theme_light                 # Optional (registered theme component name)
      layers:
        - name: geom_bar                 # Primary geom first (geom_bar, geom_point, geom_tile…)
          params: {}
        - name: position_dodge           # For side-by-side bars
          params: {}
        - name: labs
          params:
            title: "Plot Title"
            fill: "Legend Label"
  forbidden_flat_keys:
    - "position: dodge  # FORBIDDEN — must be in layers:"
    - "labels:          # FORBIDDEN — must be in layers: as 'name: labs'"

palette_registry:
  file: "config/palettes.yaml"
  format: |
    palettes:
      my_palette_name:           # Unique name; referenced in data analysis recipe palette: key
        - "#1D5B8B"
        - "#E8A020"
        - "#5FAD56"
  resolution:
    - "plot-level 'palette:' key (overrides everything)"
    - "data analysis recipe 'plot_defaults.palette:' key (applies to all plots in the data analysis recipe)"
    - "matplotlib default (no palette injection)"
  scale_injection_rules:
    - "Injects scale_fill_manual / scale_color_manual for deployment palette (hex list from registry)"
    - "Injects scale_fill_brewer / scale_color_brewer for matplotlib categorical palettes"
    - "Injects scale_fill_viridis_d / scale_color_viridis_d for viridis family names"
    - "Never injected when the data analysis recipe already declares a scale_fill_* or scale_color_* layer"
    - "Only injected for aesthetics present in the plot mapping (fill, color)"
  built_in_palettes:
    sparmvet_brand:
      - "#345beb"
      - "#10a395"
      - "#ffc107"
      - "#d62828"
      - "#6c757d"
      - "#6a4c93"

example_structure: |
  config/data_analysis_recipes/pipelines/
  ├── my_data_analysis_recipe.yaml
  └── my_data_analysis_recipe/
      ├── input_fields/
      │   ├── source_a_input_fields.yaml
      │   └── metadata_schema_input_fields.yaml
      ├── wrangling/
      │   └── source_a_wrangling.yaml
      ├── wrangling/
      │   └── Main_Collection_wrangling.yaml   # the join steps (tier1)
      └── plots/
          ├── plot_one.yaml
          └── plot_two.yaml
