[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "app"
version = "0.1.0"
dependencies = [
    "shiny>=1.0.0",
    "polars>=1.0.0",
    "pandas>=2.0.0",
    "pyyaml>=6.0.0",
    # Tier 3 orchestration: app/ may depend on any libs/ package (ADR-011).
    "utils",
    "ingestion",
    "transformer",
    "viz_factory",
    "blueprint_arch",
]
