id: bar_simple
spec_version: 1
data_engine: python-polars
plot_engine: python-plotnine
info:
  label: Bar Simple
  description: >-
    Essential for comparing counts across categories. In the Scientific Cookbook, this is the 'Staple' for categorical
    distribution.
  submission_date: '2026-04-10'
data_schemas:
  example:
    label: Example data
    description: >-
      The data of this example: 100 rows and 4 columns (id, species, amr_class, value).
    source: {type: local_tsv, path: ./assets/gallery_data/bar_simple/example_data.tsv}
    null_values: []
    strip: true
    input_fields:
      id: {type: String}
      species: {type: String}
      amr_class: {type: String}
      value: {type: Float64}
    wrangling: {tier1: []}
analysis_groups:
  example:
    label: Example
    description: The one plot of this example.
    plots:
      bar_simple:
        label: Bar Simple
        description: >-
          Drawn with geom_bar; fill is amr_class, x is species.
        taxonomy: {family: Ranking, pattern: '1 Numeric, 1 Categorical', difficulty: Simple, show: ranking, sample_size: any}
        spec:
          target_dataset: example
          mapping: {fill: amr_class, x: species}
          layers:
            - {name: geom_bar, params: {}}
