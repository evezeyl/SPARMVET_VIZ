id: line_grouped
spec_version: 1
data_engine: python-polars
plot_engine: python-plotnine
info:
  label: Line Chart (Grouped)
  description: >-
    Compare resistance trends across multiple organisms or drug classes simultaneously. Reveals diverging or converging
    trajectories that species-level aggregation would obscure.
  submission_date: '2026-05-03'
data_schemas:
  example:
    label: Example data
    description: >-
      The data of this example: 35 rows and 3 columns (year, species, mean_resistance).
    source: {type: local_tsv, path: ./assets/gallery_data/line_grouped/example_data.tsv}
    null_values: []
    strip: true
    input_fields:
      year: {type: Int64}
      species: {type: String}
      mean_resistance: {type: Float64}
    wrangling: {tier1: []}
analysis_groups:
  example:
    label: Example
    description: The one plot of this example.
    plots:
      line_grouped:
        label: Line Chart (Grouped)
        description: >-
          Drawn with geom_line; x is year, y is mean_resistance, color is species.
        taxonomy: {family: Evolution, pattern: '1 Year, 1 Numeric, 1 Categorical', difficulty: Intermediate, show: trend,
          sample_size: medium+}
        spec:
          target_dataset: example
          mapping: {x: year, y: mean_resistance, color: species}
          layers:
            - {name: geom_line, params: {size: 1.0}}
            - {name: geom_point, params: {size: 2}}
            - {name: labs, params: {x: Year, y: Mean Resistance (%), color: Species}}
            - {name: theme_minimal, params: {}}
