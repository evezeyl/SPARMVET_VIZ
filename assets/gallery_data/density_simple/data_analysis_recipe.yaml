id: density_simple
spec_version: 1
data_engine: python-polars
plot_engine: python-plotnine
info:
  label: Density Simple
  description: >-
    The 'Flavor Profile'. Shows the smooth distribution of a single numeric variable.
  submission_date: '2026-04-10'
data_schemas:
  example:
    label: Example data
    description: >-
      The data of this example: 100 rows and 3 columns (id, growth_index, species).
    source: {type: local_tsv, path: ./assets/gallery_data/density_simple/example_data.tsv}
    null_values: []
    strip: true
    input_fields:
      id: {type: String}
      growth_index: {type: Float64}
      species: {type: String}
    wrangling: {tier1: []}
analysis_groups:
  example:
    label: Example
    description: The one plot of this example.
    plots:
      density_simple:
        label: Density Simple
        description: >-
          Drawn with geom_density; fill is species, x is growth_index.
        taxonomy: {family: Distribution, pattern: 1 Numeric, difficulty: Simple, show: distribution, sample_size: medium+}
        spec:
          target_dataset: example
          mapping: {fill: species, x: growth_index}
          layers:
            - {name: geom_density, params: {}}
