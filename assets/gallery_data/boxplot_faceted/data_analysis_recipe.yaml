id: boxplot_faceted
spec_version: 1
data_engine: python-polars
plot_engine: python-plotnine
info:
  label: Boxplot Faceted
  description: >-
    Breaking down distribution by species using facets. A 'Comparative' example.
  submission_date: '2026-04-10'
data_schemas:
  example:
    label: Example data
    description: >-
      The data of this example: 100 rows and 4 columns (id, amr_class, mic_value, species).
    source: {type: local_tsv, path: ./assets/gallery_data/boxplot_faceted/example_data.tsv}
    null_values: []
    strip: true
    input_fields:
      id: {type: String}
      amr_class: {type: String}
      mic_value: {type: Float64}
      species: {type: String}
    wrangling: {tier1: []}
analysis_groups:
  example:
    label: Example
    description: The one plot of this example.
    plots:
      boxplot_faceted:
        label: Boxplot Faceted
        description: >-
          Drawn with geom_boxplot; fill is amr_class, x is amr_class, y is mic_value.
        taxonomy: {family: Comparison, pattern: '1 Numeric, 2 Categorical (Faceted)', difficulty: Intermediate,
          show: distribution, sample_size: medium+}
        spec:
          target_dataset: example
          mapping: {fill: amr_class, x: amr_class, y: mic_value}
          layers:
            - {name: geom_boxplot, params: {}}
            - {name: facet_wrap, params: {facets: species, ncol: 2}}
