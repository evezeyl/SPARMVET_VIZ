id: ridgeline_advanced
spec_version: 1
data_engine: python-polars
plot_engine: python-plotnine
info:
  label: Ridgeline Advanced
  description: >-
    Visualizes densities across multiple categories. Excellent for comparing distributions side-by-side using vertical
    faceting.
  submission_date: '2026-04-10'
data_schemas:
  example:
    label: Example data
    description: >-
      The data of this example: 200 rows and 3 columns (id, species, growth_index).
    source: {type: local_tsv, path: ./assets/gallery_data/ridgeline_advanced/example_data.tsv}
    null_values: []
    strip: true
    input_fields:
      id: {type: String}
      species: {type: String}
      growth_index: {type: Float64}
    wrangling: {tier1: []}
analysis_groups:
  example:
    label: Example
    description: The one plot of this example.
    plots:
      ridgeline_advanced:
        label: Ridgeline Advanced
        description: >-
          Drawn with geom_density; fill is species, x is growth_index.
        taxonomy: {family: Distribution, pattern: '1 Numeric, 1 Categorical', difficulty: Advanced, show: distribution,
          sample_size: medium+}
        spec:
          target_dataset: example
          mapping: {fill: species, x: growth_index}
          layers:
            - {name: geom_density, params: {alpha: 0.7}}
            - {name: facet_grid, params: {rows: species, scales: free_y}}
            - {name: theme_minimal, params: {}}
