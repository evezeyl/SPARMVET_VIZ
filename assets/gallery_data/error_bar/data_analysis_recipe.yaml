id: error_bar
spec_version: 1
data_engine: python-polars
plot_engine: python-plotnine
info:
  label: Error Bar / Point Range
  description: >-
    Shows estimated means with uncertainty bands (confidence intervals or SD). Ideal for summarised data where individual
    values are not available — communicates both the central estimate and its precision.
  submission_date: '2026-05-03'
data_schemas:
  example:
    label: Example data
    description: >-
      The data of this example: 8 rows and 4 columns (species, mean_mic, ci_low, ci_high).
    source: {type: local_tsv, path: ./assets/gallery_data/error_bar/example_data.tsv}
    null_values: []
    strip: true
    input_fields:
      species: {type: String}
      mean_mic: {type: Float64}
      ci_low: {type: Float64}
      ci_high: {type: Float64}
    wrangling: {tier1: []}
analysis_groups:
  example:
    label: Example
    description: The one plot of this example.
    plots:
      error_bar:
        label: Error Bar / Point Range
        description: >-
          Drawn with geom_pointrange; x is species, y is mean_mic, ymin is ci_low, ymax is ci_high, color is species.
        taxonomy: {family: Comparison, pattern: '1 Numeric, 1 Categorical', difficulty: Intermediate, show: uncertainty,
          sample_size: any}
        spec:
          target_dataset: example
          mapping: {x: species, y: mean_mic, ymin: ci_low, ymax: ci_high, color: species}
          layers:
            - {name: geom_pointrange, params: {size: 1.0}}
            - name: labs
              params:
                title: Mean MIC with 95% Confidence Interval by Species
                x: Species
                y: Mean MIC (log2)
