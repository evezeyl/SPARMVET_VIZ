id: point_simple
spec_version: 1
data_engine: python-polars
plot_engine: python-plotnine
info:
  label: Point Simple
  description: >-
    The 'Trace' plot. Ideal for identifying correlations between two numeric variables or time series.
  submission_date: '2026-04-10'
data_schemas:
  example:
    label: Example data
    description: >-
      The data of this example: 100 rows and 4 columns (id, date, growth_index, species).
    source: {type: local_tsv, path: ./assets/gallery_data/point_simple/example_data.tsv}
    null_values: []
    strip: true
    input_fields:
      id: {type: String}
      date: {type: String}
      growth_index: {type: Float64}
      species: {type: String}
    wrangling: {tier1: []}
analysis_groups:
  example:
    label: Example
    description: The one plot of this example.
    plots:
      point_simple:
        label: Point Simple
        description: >-
          Drawn with geom_point; color is species, x is date, y is growth_index.
        taxonomy: {family: Correlation, pattern: 2 Numeric, difficulty: Simple, show: relationship, sample_size: individual
            points}
        spec:
          target_dataset: example
          mapping: {color: species, x: date, y: growth_index}
          layers:
            - {name: geom_point, params: {}}
