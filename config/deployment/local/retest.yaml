# SPARMVET RETEST Deployment: small data analysis recipes for retesting (see .claude/tasks/retest_procedure_2026-11-06.md)
# Launch with: SPARMVET_DEPLOYMENT=config/deployment/local/retest.yaml
# Its cache and sessions live in tmp/RETEST/, apart from your normal tmp/UI_TEST/.
deployment_type: filesystem
deployment_name: "SPARMVET RETEST"
default_app_features: "developer"

locations:
  # Location 1: Raw ingestion data
  raw_data: "assets/test_data/"
  
  # Location 2: Pipeline Data Analysis Recipe definitions
  data_analysis_recipes: "config/data_analysis_recipes/retest/"
  
  # Location 3: Curated Anchors & Views (Tiers 1 & 2 Parquet)
  cache: "tmp/RETEST/parquet_data/"
  
  # Location 4: User specific artifacts, sessions, and Tier 3 outputs
  user_data: "tmp/RETEST/user/"
  
  # Location 5: Gallery examples and examples
  gallery: "assets/gallery_data/"


runtime:
  python_interpreter: "./.venv/bin/python"
