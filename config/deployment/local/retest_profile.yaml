# SPARMVET RETEST Profile: small manifests for retesting (see .claude/tasks/retest_procedure_2026-11-06.md)
# Launch with: SPARMVET_PROFILE=config/deployment/local/retest_profile.yaml
# Its cache and sessions live in tmp/RETEST/, apart from your normal tmp/UI_TEST/.
deployment_type: filesystem
deployment_name: "SPARMVET RETEST"
default_app_features: "developer"

locations:
  # Location 1: Raw ingestion data
  raw_data: "assets/test_data/"
  
  # Location 2: Pipeline Manifest definitions
  manifests: "config/manifests/retest/"
  
  # Location 3: Curated Anchors & Views (Tiers 1 & 2 Parquet)
  curated_data: "tmp/RETEST/parquet_data/"
  
  # Location 4: User specific artifacts, sessions, and Tier 3 outputs
  user_sessions: "tmp/RETEST/user/"
  
  # Location 5: Gallery examples and recipes
  gallery: "assets/gallery_data/"


runtime:
  python_interpreter: "./.venv/bin/python"
