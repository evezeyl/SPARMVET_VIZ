# SPARMVET Deployment Template
#
# Authority: ADR-048 — Multi-System Deployment Architecture
# Purpose: Describes how SPARMVET is deployed into a specific environment.
#          Copy this template, fill in your values, and point SPARMVET_DEPLOYMENT
#          at the resulting file (or place it at ~/.sparmvet/deployment.yaml or
#          /etc/sparmvet/deployment.yaml for auto-discovery).
#
# Resolution chain (first match wins):
#   1. SPARMVET_DEPLOYMENT env var → path to this file
#   2. ~/.sparmvet/deployment.yaml
#   3. /etc/sparmvet/deployment.yaml
#   4. config/deployment/local/local.yaml (dev fallback)

# ─── Identity ─────────────────────────────────────────────────────────────────
# deployment_type: what kind of system is this?
#   "filesystem"  → Galaxy, general server, local PC (data is on disk)
#   "irida"       → IRIDA integration (data fetched via REST API first)
#   "galaxy"      → Galaxy GxIT (filesystem with Galaxy-specific env vars)
deployment_type: filesystem

# Human-readable label shown in app footer (optional).
deployment_name: "My Pipeline — Institution Name"

# ─── Default startup state (both optional) ────────────────────────────────────
# default_data_analysis_recipe: the data analysis recipe that opens at startup, by file name
#   without .yaml, found in the data analysis recipes location (SPARMVET_DATA_ANALYSIS_RECIPE overrides it).
#   - If ABSENT and the app features show the selector: the user chooses.
#   - If ABSENT and the app features hide the selector: the app stops with a message (a static
#     page must say which data analysis recipe it shows).
#   - If PRESENT: it opens first; with the selector hidden the user cannot change it.
default_data_analysis_recipe: "pipeline_name"   # file name without .yaml in the data analysis recipes folder

# default_app_features: which UI app features to activate at startup.
#   Options: pipeline-static | pipeline-exploration-simple |
#            pipeline-exploration-advanced | standalone | developer
#   If absent: app features selector is shown (or defaults to pipeline-static).
default_app_features: pipeline-static

# ─── Branding (ADR-094) ────────────────────────────────────────────────────────
# branding.contact: shown to a HOME user when a data analysis recipe fails the automatic
#   load gate (structure + data-vs-contract check) and its own info.contact is absent or
#   unreadable. Strongly recommended for any deployment that hides the recipe selector
#   (pipeline-static, pipeline-exploration-simple) — in that case a broken default recipe
#   is the ONLY thing a user sees, and this is their only way to know who to ask.
# branding.banner: optional {logo_url, title, subtitle} shown in the Deployment info panel.
# branding.theme_css: optional path to a CSS file loaded after the default stylesheet.
branding:
  contact: "team@example.org"   # email, issue tracker URL, or any short contact string

# ─── Filesystem locations ─────────────────────────────────────────────────────
# project_root: absolute base path for this deployment.
#   All sub-paths under 'locations' are relative to this.
project_root: "PATH_TO_PROJECT_ROOT"

locations:
  # Location 1: Raw input files (TSV, Excel, VCF) before ingestion.
  #   Populated by the pipeline or by an admin. Read-only from app perspective.
  raw_data: "inputs/"

  # Location 2: Pipeline YAML data analysis recipes and wrangling steps.
  #   Contains the master.yaml and its !include fragments.
  data_analysis_recipes: "data_analysis_recipes/"

  # Location 3: Tier 1 & 2 Parquet caches.
  #   Written by the DataOrchestrator at first run; read on subsequent runs.
  cache: "parquet/"

  # Location 4: User-writable space.
  #   Contains export bundles (zip), session saves, Tier 3 artifacts.
  #   Must be writable by the app process.
  user_data: "sessions/"

  # Location 5: Gallery assets (pre-rendered examples, example clones).
  #   Read-only from app perspective unless gallery indexing is run.
  gallery: "gallery/"

# ─── IRIDA block (required only when deployment_type: irida) ──────────────────
# NEVER put the OAuth2 token here — inject it via SPARMVET_IRIDA_TOKEN env var.
# irida:
#   base_url: "https://irida.myinstitution.ca"
#   data_analysis_recipe_id: 42
#   auth: oauth2         # token read from SPARMVET_IRIDA_TOKEN at runtime
#   local_cache: "/tmp/sparmvet_cache/inputs/"   # where API files land before app reads them

# ─── Runtime ──────────────────────────────────────────────────────────────────
runtime:
  python_interpreter: "./.venv/bin/python"

# ─── Notes ────────────────────────────────────────────────────────────────────
# Security:
#   - Never commit API tokens or passwords to this file.
#   - Tokens are always passed via environment variables.
#   - This file may be version-controlled when correctly configured (no secrets).
#
# Multiple pipelines:
#   Deploy one instance per pipeline (recommended), each with its own deployment
#   pointing at different project_root + default_data_analysis_recipe values.
#   Alternatively, omit default_data_analysis_recipe and point data analysis recipes/ at a directory
#   containing multiple pipeline data analysis recipes — users pick from a dropdown.
#
# Galaxy:
#   Bundle this file inside the Docker image (or mount from a data library).
#   Reference it in the tool XML wrapper:
#     <environment_variable name="SPARMVET_DEPLOYMENT">/deployments/amr.yaml</environment_variable>
#
# IRIDA:
#   IRIDA injects SPARMVET_DEPLOYMENT and SPARMVET_IRIDA_TOKEN at container launch.
#   The app downloads IRIDA data to local_cache before starting — subsequent
#   behaviour is identical to a filesystem deployment.
