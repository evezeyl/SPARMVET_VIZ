# RETEST: the top_n_other action. 21 rows, 18 samples, 8 variants V1..V8 and 1 missing value.
# Sample s07 has 4 rows of V2 (so V2 has 4 rows but only 1 sample).
# With count_distinct: sample_id the 3 kept variants are V1 (6 samples), V3 (3), V4 (2, wins the tie with V5
# alphabetically). Remove the count_distinct line (EDIT HERE) and the kept ones become V1 (6 rows), V2 (4), V3 (3).
id: retest_top_n_other
spec_version: 1
data_engine: python-polars
plot_engine: python-plotnine
info:
  ui_label: RETEST top_n_other
  description: Keep the N most frequent variants, label the rest Other.
  version: '1.0'

data_schemas:
  Variants:
    ui_label: "Variants"
    source:
      type: local_tsv
      path: ./assets/test_data/retest/variants.tsv
    null_values: []
    strip: true
    completion:
      marker: Variants_not_in_original_data
      meaning: "Not yet stated by the recipe maker: an added line only says that this entity has no line in this table."
    input_fields:
      sample_id: {original_name: sample_id, type: String, ui_label: Sample, is_entity_id: true}
      variant: {original_name: variant, type: String, ui_label: Variant}
    tier1:
      steps:
        - action: step_top_n_other
          column: variant
          n: 3
          other_label: Other
          new_column: variant_top3
          count_distinct: sample_id     # EDIT HERE (test 2): delete this line, then reload
    tier2:
      steps: []

joins:
  Variants_joined:
    ui_label: "Variants joined"
    ingredients:
      - dataset_id: Variants
    tier1:
      steps: []
    tier2:
      steps: []

plot_defaults:
  theme: theme_bw

analysis_groups:
  retest:
    ui_label: "Retest"
    plots:
      variants_bar:
        ui_label: "Rows per grouped variant"
        target_dataset: Variants_joined
        mapping: {x: variant_top3}
        layers:
          - name: geom_bar
            params: {}
