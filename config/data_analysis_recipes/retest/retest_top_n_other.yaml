# RETEST: the top_n_other action. 21 rows, 18 samples, 8 variants V1..V8 and 1 missing value.
# Sample s07 has 4 rows of V2 (so V2 has 4 rows but only 1 sample).
# With count_distinct: sample_id the 3 kept variants are V1 (6 samples), V3 (3), V4 (2, wins the tie with V5
# alphabetically). Remove the count_distinct line (EDIT HERE) and the kept ones become V1 (6 rows), V2 (4), V3 (3).
id: retest_top_n_other
spec_version: 1
data_engine: python-polars
plot_engine: python-plotnine
info:
  label: RETEST top_n_other
  description: Keep the N most frequent variants, label the rest Other.
  version: '1.0'

data_schemas:
  Variants:
    source:
      type: local_tsv
      path: ./assets/test_data/retest/variants.tsv
    null_values: []
    strip: true
    input_fields:
      sample_id: {original_name: sample_id, type: Categorical, label: Sample, is_entity_key: true}
      variant: {original_name: variant, type: Categorical, label: Variant}
    wrangling:
      tier1:
        - action: step_top_n_other
          column: variant
          n: 3
          other_label: Other
          new_column: variant_top3
          count_distinct: sample_id     # EDIT HERE (test 2): delete this line, then reload
      tier2: []

joins:
  Variants_joined:
    ingredients:
      - dataset_id: Variants
    steps:
      tier1: []
      tier2: []

analysis_groups:
  retest:
    label: "Retest"
    plots:
      variants_bar:
        label: "Rows per grouped variant"
        spec:
          target_dataset: Variants_joined
          mapping: {x: variant_top3}
          layers:
            - name: geom_bar
              params: {}
