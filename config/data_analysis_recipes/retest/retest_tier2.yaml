# RETEST: Tier 2 stored as a parquet, chained keys, export (issues #10, EXPORT-CHECK-1).
# 12 samples. Join "Result" has one tier2 step: keep rows with value >= 10 (8 rows remain).
# Join "All_samples" has no tier2 step, so its T2 equals its T1 (12 rows).
# Edit the places marked "EDIT HERE" as described in .claude/workflows/retest_procedure.md.
id: retest_tier2
spec_version: 1
data_engine: python-polars
plot_engine: python-plotnine
info:
  label: RETEST Tier 2 and export
  description: Small data analysis recipe to check that Tier 2 is stored, reused and exported correctly.
  version: '1.0'

data_schemas:
  Samples:
    label: "Samples"
    source:
      type: local_tsv
      path: ./assets/test_data/retest/samples.tsv
    null_values: []
    strip: true
    input_fields:
      sample_id: {original_name: sample_id, type: String, label: Sample, is_entity_key: true}
      group: {original_name: group, type: Categorical, label: Group}
      value: {original_name: value, type: Float64, label: Value}
      year: {original_name: year, type: Categorical, label: Year}
    wrangling:
      tier1: []
      tier2: []

joins:
  Result:
    label: "Result"
    ingredients:
      - dataset_id: Samples
    steps:
      tier1: []            # EDIT HERE (RT-05): move the tier2 step below up to this list
      tier2:               # EDIT HERE (RT-04): change value: 10 to value: 20
        - action: modif_filter
          column: value
          op: ge
          value: 10
          na: remove
  All_samples:
    label: "All samples"
    ingredients:
      - dataset_id: Samples
    steps:
      tier1: []
      tier2: []

analysis_groups:
  retest:
    label: "Retest"
    plots:
      value_by_group:
        label: "Value by group (join with a tier2 step)"
        spec:
          target_dataset: Result
          mapping: {x: group, y: value}
          layers:
            - name: geom_boxplot
              params: {}
      samples_per_year:
        label: "Samples per year (join without tier2)"
        spec:
          target_dataset: All_samples
          mapping: {x: year}
          layers:
            - name: geom_bar
              params: {}
