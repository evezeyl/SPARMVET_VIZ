# RETEST: a declared output field that matches no column. The data has predicted_phenotype;
# output_fields declares "phenotype". Expected: the load gate refuses the recipe at startup and the
# recipe choice panel lists it as unavailable with the reason and the tip (retest procedure, RT-31).
id: retest_bad_output_field
spec_version: 1
data_engine: python-polars
plot_engine: python-plotnine
info:
  label: RETEST bad output field
  description: output_fields names a column that does not exist.
  version: '1.0'

data_schemas:
  Genes:
    source:
      type: local_tsv
      path: ./assets/test_data/retest/genes.tsv
    null_values: ["", "NA", "N/A", "None", "null", "NaN", "-", "na", "n/a", "none", "nan", "NULL", "n.a.", "N.A."]
    strip: true
    input_fields:
      sample_id: {original_name: sample_id, type: Categorical, label: Sample, is_entity_key: true}
      gene: {original_name: gene, type: Categorical, label: Gene}
      predicted_phenotype: {original_name: predicted_phenotype, type: Categorical, label: Phenotype}
    wrangling:
      tier1: []
      tier2: []
    output_fields:
      sample_id: {type: categorical}
      phenotype: {type: categorical}      # EDIT HERE (test 3): change to predicted_phenotype

joins:
  Genes_joined:
    ingredients:
      - dataset_id: Genes
    steps:
      tier1: []
      tier2: []

analysis_groups:
  retest:
    label: "Retest"
    plots:
      genes_bar:
        label: "Genes"
        spec:
          target_dataset: Genes_joined
          mapping: {x: gene}
          layers:
            - name: geom_bar
              params: {}
