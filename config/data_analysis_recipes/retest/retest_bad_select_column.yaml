# RETEST: a polars_select step that names a column the dataset does not have. The data has
# predicted_phenotype; the step asks for "phenotype". Expected: the load gate refuses the recipe at
# startup (the data check) and the recipe choice panel lists it as unavailable, with the message of the engine
# (retest procedure, RT-31).
id: retest_bad_select_column
spec_version: 1
data_engine: python-polars
plot_engine: python-plotnine
info:
  ui_label: RETEST bad select column
  description: A polars_select step names a column that does not exist; the app must say so.
  version: '1.0'

data_schemas:
  Genes:
    ui_label: "Genes"
    source:
      type: local_tsv
      path: ./assets/test_data/retest/genes.tsv
    null_values: []
    strip: true
    completion:
      marker: Genes_not_in_original_data
      meaning: "Not yet stated by the recipe maker: an added line only says that this entity has no line in this table."
    input_fields:
      sample_id: {original_name: sample_id, type: String, ui_label: Sample, is_entity_id: true}
      gene: {original_name: gene, type: String, ui_label: Gene}
      predicted_phenotype: {original_name: predicted_phenotype, type: String, ui_label: Phenotype}
    tier1:
      steps:
        - action: polars_select
          exprs: [sample_id, gene, phenotype]      # EDIT HERE (RT-31): change phenotype to predicted_phenotype
    tier2:
      steps: []

joins:
  Genes_joined:
    ui_label: "Genes joined"
    ingredients:
      - dataset_id: Genes
    tier1:
      steps: []
    tier2:
      steps: []

plot_defaults:
  theme: theme_bw

analysis_groups:
  retest:
    ui_label: "Retest"
    plots:
      bad_select_genes_bar:
        ui_label: "Genes"
        target_dataset: Genes_joined
        mapping: {x: gene}
        layers:
          - name: geom_bar
            params: {}
