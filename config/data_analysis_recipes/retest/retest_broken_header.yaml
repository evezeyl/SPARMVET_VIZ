# RETEST: a dataset whose file has a renamed header. The data analysis recipe declares the column
# predicted_phenotype; the file genes_renamed_header.tsv calls it phenotype_renamed.
# Expected: the load gate refuses the recipe at startup and the recipe choice panel lists it as
# unavailable, naming the dataset and the missing column (retest procedure, RT-30).
id: retest_broken_header
spec_version: 1
data_engine: python-polars
plot_engine: python-plotnine
info:
  ui_label: RETEST broken header
  description: The data file has a renamed column; the app must say so.
  version: '1.0'

data_schemas:
  Genes:
    ui_label: "Genes"
    source:
      type: local_tsv
      path: ./assets/test_data/retest/genes_renamed_header.tsv   # EDIT HERE (RT-30): use genes.tsv, restart the app, it works
    null_values: []
    strip: true
    completion:
      marker: not_in_original_data
      meaning: no result for this entity
    input_fields:
      sample_id: {original_name: sample_id, type: String, ui_label: Sample, is_entity_id: true}
      gene: {original_name: gene, type: String, ui_label: Gene}
      predicted_phenotype: {original_name: predicted_phenotype, type: String, ui_label: Phenotype}
    tier1:
      steps: []
    tier2:
      steps: []

joins:
  Genes_joined:
    ui_label: "Genes joined"
    ingredients:
      - dataset_id: Genes
    tier1:
      steps: []
    tier2:
      steps: []

plot_defaults:
  theme: theme_bw

analysis_groups:
  retest:
    ui_label: "Retest"
    plots:
      genes_bar:
        ui_label: "Genes"
        target_dataset: Genes_joined
        mapping: {x: gene}
        layers:
          - name: geom_bar
            params: {}
