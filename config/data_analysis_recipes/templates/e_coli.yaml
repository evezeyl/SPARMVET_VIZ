id: e_coli
spec_version: 1
data_engine: python-polars
plot_engine: python-plotnine
info:
  label: E. coli Comprehensive Analysis
  category: AMR Analysis
  description: 'Template for E. coli data: AMR genes, MLST, serotype, and growth phenotype.'
  version: '1.0'
data_schemas:
  amr_results:
    source:
      type: local_tsv
      path: ./assets/pipeline_output/ecoli_amr_results.tsv
    # Texts that mean "not recorded" in EVERY field of this table (usually none). A text that means missing only in one
    # field is declared on that field: null_values: ["NA"] under the field (assets/scripts/declare_missing_values.py).
    null_values: []
    strip: true
    input_fields:
      sample_id:
        original_name: sample_id
        type: Categorical
        is_entity_key: true
        label: Sample ID
      serotype:
        original_name: serotype
        type: Categorical
        label: Serotype
      sequence_type:
        original_name: ST
        type: Categorical
        label: Sequence Type
      ctx_m_gene:
        original_name: bla_CTX-M
        type: Categorical
        label: CTX-M Gene
      growth_rate:
        original_name: growth_rate
        type: Float64
        label: Growth Rate (OD600)
    wrangling:
      tier1:
      # strip_whitespace: removed by the migration, it had nothing to act on (no String column at that point)
metadata_schema:
  source:
    type: local_tsv
    path: ./assets/pipeline_output/ecoli_metadata.tsv
  # Texts that mean "not recorded" in EVERY field of this table (usually none). A text that means missing only in one
  # field is declared on that field: null_values: ["NA"] under the field (assets/scripts/declare_missing_values.py).
  null_values: []
  strip: true
  input_fields:
    sample_id:
      original_name: isolate_id
      type: Categorical
      is_entity_key: true
    collection_date:
      original_name: collection_date
      type: Categorical
      label: Collection Date
    country_of_origin:
      original_name: country_of_origin
      type: Categorical
      label: Country of Origin
    hospital_site:
      original_name: hospital_site
      type: Categorical
      label: Hospital Site
    patient_age:
      original_name: patient_age
      type: Float64
      label: Patient Age
    patient_outcome:
      original_name: patient_outcome
      type: Categorical
      label: Outcome
  wrangling:
    tier1: []
joins:
  amr_with_metadata:
    description: Join AMR results with metadata.
    ingredients:
    - dataset_id: amr_results
    - dataset_id: metadata_schema
    steps:
      tier1:
      - action: polars_join
        right_ingredient: metadata_schema
        'on': [sample_id]
        how: left
        maintain_order: left_right
plot_defaults:
  height: 450
  theme: theme_minimal
  show_legend: true
analysis_groups:
  AMR:
    description: 💊 Antimicrobial Resistance
    plots:
      serotype_dist:
        info: Distribution of serotypes across samples.
        spec:
          target_dataset: amr_with_metadata
          title: Serotype Distribution by Country
          family: Distribution
          pattern: 2 Categorical
          difficulty: Beginner
          mapping:
            x: serotype
            fill: country_of_origin
          layers:
          - name: geom_bar
            params: {}
      growth_rate_by_st:
        info: Growth rate distribution by sequence type.
        spec:
          target_dataset: amr_with_metadata
          title: Growth Rate by Sequence Type
          family: Distribution
          pattern: 1 Numeric, 1 Categorical
          difficulty: Simple
          mapping:
            x: sequence_type
            y: growth_rate
            fill: sequence_type
          layers:
          - name: geom_boxplot
            params: {}
