id: simple_template
spec_version: 1
data_engine: python-polars
plot_engine: python-plotnine
info:
  label: Simple Demo
  description: 'Minimal self-contained data analysis recipe: 1 dataset, 1 metadata, 1 assembly,
    1 plot.'
  version: '1.0'
data_schemas:
  primary_data:
    source:
      type: local_tsv
      path: ./assets/test_data/simple_data.tsv
    # Texts that mean "not recorded" in EVERY field of this table (usually none). A text that means missing only in one
    # field is declared on that field: null_values: ["NA"] under the field (assets/scripts/declare_missing_values.py).
    null_values: []
    strip: true
    input_fields:
      sample_id:
        original_name: ID
        type: Categorical
        is_entity_key: true
      value:
        original_name: Measurement
        type: Float64
        label: Measurement Value
      group:
        original_name: Group
        type: Categorical
        label: Sample Group
    wrangling:
      tier1:
      # strip_whitespace: removed by the migration, it had nothing to act on (no String column at that point)
    output_fields:
      sample_id:
        original_name: sample_id
        type: categorical
        label: Sample ID
      value:
        original_name: value
        type: numeric
        label: Measurement Value
      group:
        original_name: group
        type: categorical
        label: Group
metadata_schema:
  source:
    type: local_tsv
    path: ./assets/test_data/simple_metadata.tsv
  # Texts that mean "not recorded" in EVERY field of this table (usually none). A text that means missing only in one
  # field is declared on that field: null_values: ["NA"] under the field (assets/scripts/declare_missing_values.py).
  null_values: []
  strip: true
  input_fields:
    sample_id:
      original_name: ID
      type: Categorical
      is_entity_key: true
    category:
      original_name: Category
      type: Categorical
      label: Biological Category
  wrangling:
    tier1: []
  output_fields:
    sample_id:
      original_name: sample_id
      type: categorical
      label: Sample ID
    category:
      original_name: category
      type: categorical
      label: Biological Category
joins:
  main_collection:
    description: Joins primary data with metadata.
    ingredients:
    - dataset_id: primary_data
    - dataset_id: metadata_schema
    steps:
      tier1:
      - action: polars_join
        right_ingredient: metadata_schema
        'on': [sample_id]
        how: left
        maintain_order: left_right
analysis_groups:
  Overview:
    description: 📊 Summary overview
    plots:
      value_by_group:
        info: Distribution of measurement values per group.
        spec:
          target_dataset: main_collection
          title: Measurement Values by Group
          family: Distribution
          pattern: 1 Numeric, 2 Categorical
          difficulty: Beginner
          mapping:
            x: group
            y: value
            fill: category
          layers:
          - name: geom_col
            params: {}
