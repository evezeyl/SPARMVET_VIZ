id: audit
spec_version: 1
data_engine: python-polars
plot_engine: python-plotnine
info:
  label: Lab Submission Audit
  category: Quality Control
  description: 'Template for auditing lab submission data: TAT monitoring, throughput,
    and status tracking.'
  version: '1.0'
data_schemas:
  submission_logs:
    label: "submission logs"
    source:
      type: local_tsv
      path: ./assets/audit_data/submission_logs.tsv
    # Texts that mean "not recorded" in EVERY field of this table (usually none). A text that means missing only in one
    # field is declared on that field: null_values: ["NA"] under the field (assets/scripts/declare_missing_values.py).
    null_values: []
    strip: true
    input_fields:
      lab_id:
        original_name: lab_id
        type: Categorical
        is_entity_key: true
        label: Source Laboratory
      submission_date:
        original_name: submission_date
        type: Categorical
        label: Date of Submission
      status:
        original_name: status
        type: Categorical
        label: Processing Status
      turnaround_time:
        original_name: turnaround_time
        type: Float64
        label: TAT (Days)
    wrangling:
      tier1:
      # strip_whitespace: removed by the migration, it had nothing to act on (no String column at that point)
plot_defaults:
  theme: theme_minimal
analysis_groups:
  Performance:
    label: "⏱️ Lab Speed and Efficiency"
    description: ⏱️ Lab Speed and Efficiency
    plots:
      tat_distribution:
        label: "Tat Distribution"
        taxonomy: {"family": "Distribution", "pattern": "1 Numeric, 1 Categorical", "difficulty": "Simple"}
        description: "Distribution of turnaround times per laboratory."
        spec:
          target_dataset: submission_logs
          title: Turnaround Time by Laboratory
          mapping:
            x: lab_id
            y: turnaround_time
            fill: lab_id
          layers:
          - name: geom_boxplot
            params: {}
  Volumes:
    label: "📦 Throughput and Backlogs"
    description: 📦 Throughput and Backlogs
    plots:
      submission_status:
        label: "Submission Status"
        taxonomy: {"family": "Ranking", "pattern": "2 Categorical", "difficulty": "Beginner"}
        description: "Submissions by current processing status."
        spec:
          target_dataset: submission_logs
          title: Submissions by Current Status
          mapping:
            x: status
            fill: lab_id
          layers:
          - name: geom_bar
            params: {}
