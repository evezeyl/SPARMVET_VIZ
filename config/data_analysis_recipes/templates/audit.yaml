id: audit
spec_version: 1
data_engine: python-polars
plot_engine: python-plotnine
info:
  label: Lab Submission Audit
  category: Quality Control
  description: 'Template for auditing lab submission data: TAT monitoring, throughput,
    and status tracking.'
  version: '1.0'
data_schemas:
  submission_logs:
    source:
      type: local_tsv
      path: ./assets/audit_data/submission_logs.tsv
    # Texts that mean "not recorded" in EVERY field of this table (usually none). A text that means missing only in one
    # field is declared on that field: null_values: ["NA"] under the field (assets/scripts/declare_missing_values.py).
    null_values: []
    strip: true
    input_fields:
      lab_id:
        original_name: lab_id
        type: Categorical
        is_entity_key: true
        label: Source Laboratory
      submission_date:
        original_name: submission_date
        type: Categorical
        label: Date of Submission
      status:
        original_name: status
        type: Categorical
        label: Processing Status
      turnaround_time:
        original_name: turnaround_time
        type: Float64
        label: TAT (Days)
    wrangling:
      tier1:
      # strip_whitespace: removed by the migration, it had nothing to act on (no String column at that point)
    output_fields:
      lab_id:
        original_name: lab_id
        type: categorical
        label: Source Laboratory
      submission_date:
        original_name: submission_date
        type: categorical
        label: Date of Submission
      status:
        original_name: status
        type: categorical
        label: Processing Status
      turnaround_time:
        original_name: turnaround_time
        type: numeric
        label: TAT (Days)
plot_defaults:
  height: 500
  theme: theme_minimal
  show_legend: true
analysis_groups:
  Performance:
    description: ⏱️ Lab Speed and Efficiency
    plots:
      tat_distribution:
        info: Distribution of turnaround times per laboratory.
        spec:
          target_dataset: submission_logs
          title: Turnaround Time by Laboratory
          family: Distribution
          pattern: 1 Numeric, 1 Categorical
          difficulty: Simple
          mapping:
            x: lab_id
            y: turnaround_time
            fill: lab_id
          layers:
          - name: geom_boxplot
            params: {}
  Volumes:
    description: 📦 Throughput and Backlogs
    plots:
      submission_status:
        info: Submissions by current processing status.
        spec:
          target_dataset: submission_logs
          title: Submissions by Current Status
          family: Ranking
          pattern: 2 Categorical
          difficulty: Beginner
          mapping:
            x: status
            fill: lab_id
          layers:
          - name: geom_bar
            params: {}
