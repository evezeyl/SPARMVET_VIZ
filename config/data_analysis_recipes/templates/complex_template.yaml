# Complex Template
# Use this for large-scale data analysis recipes requiring modularity and shared fragments.

id: complex_template
spec_version: 1
data_engine: python-polars
plot_engine: python-plotnine
info:
  ui_label: "Complex Enterprise Demo"
  description: "Modular data analysis recipe using !include for relational integrity and reuse."
  version: "1.0"

data_schemas:
  genomics:
    ui_label: "genomics"
    source:
      type: "local_tsv"
      path: "./assets/test_data/genomics_data.tsv"
    # Texts that mean "not recorded" in EVERY field of this table (usually none). A text that means missing only in one
    # field is declared on that field: null_values: ["NA"] under the field (assets/scripts/declare_missing_values.py).
    null_values: []
    strip: true
    completion:
      marker: genomics_not_in_original_data
      meaning: "Not yet stated by the recipe maker: an added line only says that this entity has no line in this table."
    input_fields: !include 'complex_template/genomics_input.yaml'
    tier1: !include 'complex_template/genomics_wrangling.yaml'

metadata_schema:
  ui_label: "Metadata"
  source:
    type: "local_tsv"
    path: "./assets/test_data/metadata.tsv"
  # Texts that mean "not recorded" in EVERY field of this table (usually none). A text that means missing only in one
  # field is declared on that field: null_values: ["NA"] under the field (assets/scripts/declare_missing_values.py).
  null_values: []
  strip: true
  completion:
    marker: metadata_schema_not_in_original_data
    meaning: "Not yet stated by the recipe maker: an added line only says that this entity has no line in this table."
  input_fields: !include 'complex_template/metadata_input.yaml'
  tier1: {steps: []}

joins:
  master_assembly:
    ui_label: "master assembly"
    description: "Joins genomics with metadata."
    ingredients:
      - dataset_id: "genomics"
      - dataset_id: "metadata_schema"
    tier1: !include 'complex_template/master_steps.yaml'

plot_defaults:
  theme: theme_bw

analysis_groups:
  Overview:
    ui_label: "Overview"
    plots:
      gene_presence_by_country:
        ui_label: "Gene presence by country"
        target_dataset: master_assembly
        mapping:
          x: country
          fill: gene_presence
        layers:
          - name: geom_bar
            params: {}
