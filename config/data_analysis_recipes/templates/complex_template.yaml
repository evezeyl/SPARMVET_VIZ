# Complex Template
# Use this for large-scale data analysis recipes requiring modularity and shared fragments.

id: complex_template
spec_version: 1
data_engine: python-polars
plot_engine: python-plotnine
info:
  label: "Complex Enterprise Demo"
  description: "Modular data analysis recipe using !include for relational integrity and reuse."
  version: "1.0"

data_schemas:
  genomics:
    label: "genomics"
    source:
      type: "local_tsv"
      path: "./assets/test_data/genomics_data.tsv"
    # Texts that mean "not recorded" in EVERY field of this table (usually none). A text that means missing only in one
    # field is declared on that field: null_values: ["NA"] under the field (assets/scripts/declare_missing_values.py).
    null_values: []
    strip: true
    input_fields: !include 'complex_template/genomics_input.yaml'
    wrangling: !include 'complex_template/genomics_wrangling.yaml'

metadata_schema:
  label: "Metadata"
  source:
    type: "local_tsv"
    path: "./assets/test_data/metadata.tsv"
  # Texts that mean "not recorded" in EVERY field of this table (usually none). A text that means missing only in one
  # field is declared on that field: null_values: ["NA"] under the field (assets/scripts/declare_missing_values.py).
  null_values: []
  strip: true
  input_fields: !include 'complex_template/metadata_input.yaml'
  wrangling: {tier1: []}

joins:
  master_assembly:
    label: "master assembly"
    description: "Joins genomics with metadata."
    ingredients:
      - dataset_id: "genomics"
      - dataset_id: "metadata_schema"
    steps: !include 'complex_template/master_steps.yaml'

analysis_groups:
  Overview:
    label: "Overview"
    plots:
      gene_presence_by_country:
        label: "Gene presence by country"
        spec:
          target_dataset: master_assembly
          mapping:
            x: country
            fill: gene_presence
          layers:
            - name: geom_bar
              params: {}
