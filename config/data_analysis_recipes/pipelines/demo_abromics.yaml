id: demo_abromics
spec_version: 1
data_engine: python-polars
plot_engine: python-plotnine
info:
  label: 'Demo: Abromics Pipeline (High Integrity)'
  contact: "Eve (evezeyl@gmail.com) — contact in case of problems"
  description: Synchronized test data for Phase 4/5 demonstration.
  version: '1.2'
data_schemas:
  MLST:
    source:
      type: local_tsv
      path: ./assets/test_data/demo_high_integrity/test_data_test_data_MLST_results_20260307_105756.tsv
    null_values: []
    strip: true
    input_fields: !include '1_test_data_ST22_dummy/input_fields/MLST_input_fields.yaml'
    wrangling: !include '1_test_data_ST22_dummy/wrangling/MLST_wrangling.yaml'
metadata_schema:
  source:
    type: local_tsv
    path: ./assets/test_data/demo_high_integrity/test_data_test_metadata_20260307_105756.tsv
  null_values: []
  strip: true
  input_fields: !include '1_test_data_ST22_dummy/input_fields/metadata_schema_input_fields.yaml'
  wrangling:
    tier1: []
    tier2: []
joins:
  demo_join:
    description: One row per sample with its sequence type (MLST) and the source, year and country from the metadata.
    ingredients:
    - dataset_id: MLST
    - dataset_id: metadata_schema
    labels: {sequence_type: Sequence Type, source: Source, year: Year, country: Country}
    steps:
      tier1:
      - action: polars_join
        right_ingredient: metadata_schema
        'on': [sample_id]
        how: inner
        maintain_order: left_right
      # the year is read as a number; as a category on a plot axis it must be 2024, not 2024.0
      - action: polars_cast
        columns: [year]
        dtype: Int64
      - action: polars_cast
        columns: [year]
        dtype: String
      - action: polars_select
        exprs: [sample_id, sequence_type, source, year, country]
      tier2: []
analysis_groups:
  MLST_Overview:
    label: MLST Overview
    plots:
      demo_st_by_source:
        label: Sequence Types by Source
        spec:
          target_dataset: demo_join
          mapping:
            x: sequence_type
            fill: source
          layers:
          - name: geom_bar
            params: {}
