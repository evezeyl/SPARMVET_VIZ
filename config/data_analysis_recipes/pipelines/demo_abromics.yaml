id: demo_abromics
spec_version: 1
data_engine: python-polars
plot_engine: python-plotnine
info:
  ui_label: 'Demo: Abromics Pipeline (High Integrity)'
  contact: "Eve (evezeyl@gmail.com) — contact in case of problems"
  description: "Synchronized test data for Phase 4/5 demonstration. The table `demo join` starts from the MLST table, in which the app has added a line for each sample of the metadata that has no MLST result: 12 samples have no MLST result and show the sequence type \"Non Determined\"; the metadata is brought in by a left join, so the table has one row per sample (27 rows for 27 samples)."
  version: '1.2'
data_schemas:
  MLST:
    ui_label: "MLST"
    description: "One row per sample and MLST scheme: a sample has one sequence type per scheme. Every sample id of this file is one of the samples of the metadata."
    source:
      type: local_tsv
      path: ./assets/test_data/demo_high_integrity/test_data_test_data_MLST_results_20260307_105756.tsv
    null_values: []
    strip: true
    completion:
      marker: MLST_not_in_original_data
      meaning: "Not yet stated by the recipe maker: an added line only says that this entity has no line in this table."
    input_fields: !include '1_test_data_ST22_dummy/input_fields/MLST_input_fields.yaml'
    tier1: !include '1_test_data_ST22_dummy/wrangling/MLST_wrangling.yaml'
metadata_schema:
  ui_label: "metadata"
  description: "One row per metadata line (source, year, country). In this demo file no sample id is repeated and every line has an id (the three lines that had none were removed from the file, D-0624)."
  source:
    type: local_tsv
    path: ./assets/test_data/demo_high_integrity/test_data_test_metadata_20260307_105756.tsv
  null_values: []
  strip: true
  completion:
    marker: metadata_schema_not_in_original_data
    meaning: "Not yet stated by the recipe maker: an added line only says that this entity has no line in this table."
  input_fields: !include '1_test_data_ST22_dummy/input_fields/metadata_schema_input_fields.yaml'
  tier1:
    steps: []
  tier2:
    steps: []
joins:
  demo_join:
    ui_label: "demo join"
    description: "One row per sample: the MLST table has one row per sample and scheme, and the app has added a line for each sample of the metadata that has no MLST result: in this demo data 12 of the 27 samples have no MLST result and show the sequence type \"Non Determined\" (an unknown result, not a missing value). The table starts from the MLST table (data first) and brings in the source, year and country by a left join with the metadata, so no sample is lost: 27 rows for 27 samples."
    ingredients:
    # the data comes first: the left join keeps every line of the MLST table, which the app completed with every sample of the metadata
    - dataset_id: MLST
    - dataset_id: metadata_schema
    labels: {sequence_type: Sequence Type, source: Source, year: Year, country: Country}
    tier1:
      steps:
      # a left join: every line of the MLST table stays (the app completed it with every id of the metadata)
      - action: polars_join
        right_ingredient: metadata_schema
        'on': [sample_id]
        how: left
        maintain_order: left_right
      # a sample that has no MLST result is not a missing value: its result is not determined (same text as the MLST table of 1_test_data_ST22_dummy)
      - action: polars_fill_null
        columns: [sequence_type]
        value: Non Determined
      # the year is read as a number; as a category on a plot axis it must be 2024, not 2024.0
      - action: polars_cast
        columns: [year]
        dtype: Int64
      - action: polars_cast
        columns: [year]
        dtype: String
      - action: polars_select
        exprs: [sample_id, sequence_type, source, year, country]
    tier2:
      steps: []
plot_defaults:
  theme: theme_bw

analysis_groups:
  MLST_Overview:
    ui_label: MLST Overview
    description: "Which sequence types occur in each source."
    plots:
      demo_st_by_source:
        ui_label: Sequence Types by Source
        description: "Bars count the rows of the joined table (one row per sample) for each sequence type, coloured by source. The bar \"Non Determined\" holds the samples that have no MLST result or an unknown one."
        target_dataset: demo_join
        mapping:
          x: sequence_type
          fill: source
        layers:
        - name: geom_bar
          params: {}
