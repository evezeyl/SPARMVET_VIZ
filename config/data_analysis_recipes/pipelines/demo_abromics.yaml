id: demo_abromics
spec_version: 1
data_engine: python-polars
plot_engine: python-plotnine
info:
  label: 'Demo: Abromics Pipeline (High Integrity)'
  contact: "Eve (evezeyl@gmail.com) — contact in case of problems"
  description: Synchronized test data for Phase 4/5 demonstration.
  version: '1.2'
data_schemas:
  MLST:
    label: "MLST"
    description: "One row per MLST result of a sample; in this demo file a sample can appear on more than one row."
    source:
      type: local_tsv
      path: ./assets/test_data/demo_high_integrity/test_data_test_data_MLST_results_20260307_105756.tsv
    null_values: []
    strip: true
    input_fields: !include '1_test_data_ST22_dummy/input_fields/MLST_input_fields.yaml'
    wrangling: !include '1_test_data_ST22_dummy/wrangling/MLST_wrangling.yaml'
metadata_schema:
  label: "metadata"
  description: "One row per metadata line (source, year, country). In this demo file no sample id is repeated, but three lines have no usable id (one empty, one written as a dash, one written as two quote marks); all three are read as missing."
  source:
    type: local_tsv
    path: ./assets/test_data/demo_high_integrity/test_data_test_metadata_20260307_105756.tsv
  null_values: []
  strip: true
  input_fields: !include '1_test_data_ST22_dummy/input_fields/metadata_schema_input_fields.yaml'
  wrangling:
    tier1: []
    tier2: []
joins:
  demo_join:
    label: "demo join"
    description: "One row per MLST result of a sample, and one row for a sample that has no MLST result. The table starts from the metadata (27 samples with an id) and adds the MLST results to it (a left join), so no sample of the metadata is lost: in this demo data 12 of the 27 samples have no MLST result and show the sequence type \"Non Determined\" (an unknown result, not a missing value). A sample that is repeated in the MLST data appears more than once, so there are more rows than samples (40 rows for 27 samples). Removed by this recipe, on purpose: the 3 metadata lines that have no sample id (they cannot be linked to any result), and the 2 MLST rows of 2 samples (SYN_38282317 and SYN_67199832) that are not in the metadata."
    ingredients:
    # the metadata comes first: it is the list of the samples, and the left join keeps every one of them
    - dataset_id: metadata_schema
    - dataset_id: MLST
    labels: {sequence_type: Sequence Type, source: Source, year: Year, country: Country}
    steps:
      tier1:
      # a metadata line without a sample id cannot be linked to an MLST result: it is removed here (3 lines in this demo data)
      - action: polars_drop_nulls
        subset: [sample_id]
      # a left join: every sample of the metadata stays, with or without an MLST result
      - action: polars_join
        right_ingredient: MLST
        'on': [sample_id]
        how: left
        maintain_order: left_right
      # a sample that has no MLST result is not a missing value: its result is not determined (same text as the MLST table of 1_test_data_ST22_dummy)
      - action: polars_fill_null
        columns: [sequence_type]
        value: Non Determined
      # the year is read as a number; as a category on a plot axis it must be 2024, not 2024.0
      - action: polars_cast
        columns: [year]
        dtype: Int64
      - action: polars_cast
        columns: [year]
        dtype: String
      - action: polars_select
        exprs: [sample_id, sequence_type, source, year, country]
      tier2: []
analysis_groups:
  MLST_Overview:
    label: MLST Overview
    description: "Which sequence types occur in each source."
    plots:
      demo_st_by_source:
        label: Sequence Types by Source
        description: "Bars count the rows of the joined table (a sample repeated in the MLST data counts more than once) for each sequence type, coloured by source. The bar \"Non Determined\" holds the samples that have no MLST result or an unknown one."
        spec:
          target_dataset: demo_join
          mapping:
            x: sequence_type
            fill: source
          layers:
          - name: geom_bar
            params: {}
