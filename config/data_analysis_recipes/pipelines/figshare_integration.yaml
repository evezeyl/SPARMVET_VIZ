id: figshare_integration
spec_version: 1
data_engine: python-polars
plot_engine: python-plotnine
info:
  ui_label: Figshare AMR Triple-Source Integration
  contact: "Eve (evezeyl@gmail.com) — contact in case of problems"
  category: Integration Demo
  tags:
  - figshare
  - AMR
  - livestock
  - E. coli
  - demo
  description: 'Triple-source integration of AMR metadata, phenotypic resistance,
    and genotypic resistance data from Chung (2023). CC-BY 4.0. https://doi.org/10.6084/m9.figshare.21737288.v1'
  version: '1.0'

# ── Data Schemas ──────────────────────────────────────────────────────────────
# Fragment files: figshare_integration/{input_fields,wrangling,output_fields}/
data_schemas:
  fg_metadata:
    ui_label: "fg metadata"
    description: "One row per animal sample with host species, specimen source, final diagnosis and infection site."
    source:
      type: local_tsv
      path: ./libs/transformer/tests/data/fg_metadata.tsv
    null_values: []
    strip: true
    completion:
      marker: fg_metadata_not_in_original_data
      meaning: "Not yet stated by the recipe maker: an added line only says that this entity has no line in this table."
    input_fields: !include 'figshare_integration/input_fields/fg_metadata_input_fields.yaml'
    tier1: !include 'figshare_integration/wrangling/fg_metadata_wrangling.yaml'

  fg_phenotypes:
    ui_label: "fg phenotypes"
    description: "One row per sample and antibiotic test (MIC id) with the breakpoint and the predicted phenotype."
    source:
      type: local_tsv
      path: ./libs/transformer/tests/data/fg_phenotypes.tsv
    null_values: []
    strip: true
    completion:
      marker: fg_phenotypes_not_in_original_data
      meaning: "Not yet stated by the recipe maker: an added line only says that this entity has no line in this table."
    input_fields: !include 'figshare_integration/input_fields/fg_phenotypes_input_fields.yaml'
    tier1: !include 'figshare_integration/wrangling/fg_phenotypes_wrangling.yaml'

  fg_genotypes:
    ui_label: "fg genotypes"
    description: "One row per resistance gene line reported for a sample, with the gene type, identifier, gene family and resistance class; the same gene can appear on more than one row of a sample."
    source:
      type: local_tsv
      path: ./libs/transformer/tests/data/fg_genotypes.tsv
    null_values: []
    strip: true
    completion:
      marker: fg_genotypes_not_in_original_data
      meaning: "Not yet stated by the recipe maker: an added line only says that this entity has no line in this table."
    input_fields: !include 'figshare_integration/input_fields/fg_genotypes_input_fields.yaml'
    tier1: !include 'figshare_integration/wrangling/fg_genotypes_wrangling.yaml'

# ── Assembly Data Analysis Recipes ────────────────────────────────────────────────────────
joins:
  figshare_triple_join:
    ui_label: "figshare triple join"
    description: '3-way left join: metadata (anchor) -> phenotypes -> genotypes.
      Phenotypes expand rows per antibiotic (MIC). Genotypes expand rows per detected
      gene. The join is intentionally "long" to enable faceted visualisation.'
    ingredients:
    - dataset_id: fg_metadata
    - dataset_id: fg_phenotypes
    - dataset_id: fg_genotypes
    tier1: !include 'figshare_integration/wrangling/figshare_triple_join_steps.yaml'

plot_defaults:
  theme: theme_bw

# ── Analysis Groups ───────────────────────────────────────────────────────────
# Plot specs: see figshare_integration/plots/
analysis_groups:
  AMR Integration:
    ui_label: "🧬 AMR Phenotype × Genotype × Host Integration"
    description: 🧬 AMR Phenotype × Genotype × Host Integration
    plots:
      plot_a_phenotype_bar: !include figshare_integration/plots/plot_a_phenotype_bar.yaml
      plot_b_genotype_bar: !include figshare_integration/plots/plot_b_genotype_bar.yaml
      plot_c_resistance_class: !include figshare_integration/plots/plot_c_resistance_class.yaml
