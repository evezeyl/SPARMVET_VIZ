id: 1_Abromics_general_pipeline
spec_version: 1
data_engine: python-polars
plot_engine: python-plotnine
info:
  ui_label: Abromics General Pipeline
  contact: "Eve (evezeyl@gmail.com) — contact in case of problems"
  category: Edited
  tags:
  - Abromics
  - SOA8_ST2.2
  - SPARMVET
  - STEC
  - Escherichia coli
  description: Data analysis recipe for Abromics General Pipeline. SPARMVET. Usable for STEC /
    E.coli.
  version: '1.0'
data_schemas:
  MLST:
    ui_label: "MLST"
    description: "One row per sample: the MLST sequence type (the strain type given by the alleles of several genes) of each isolate."
    source:
      type: local_tsv
      path: ./assets/test_data/1_test_data_ST22_dummy/test_data_MLST_results_20260307_105756.tsv
    null_values: []
    strip: true
    completion:
      marker: MLST_not_in_original_data
      meaning: "Not yet stated by the recipe maker: an added line only says that this entity has no line in this table."
    input_fields: !include '1_test_data_ST22_dummy/input_fields/MLST_input_fields.yaml'
    tier1: !include '1_test_data_ST22_dummy/wrangling/MLST_wrangling.yaml'
  VirulenceFinder:
    ui_label: "VirulenceFinder"
    description: "One row per sample and virulence gene found by VirulenceFinder, with the serotype of the sample."
    source:
      type: local_tsv
      path: ./assets/test_data/2_VIGAS-P_ST22_dummy/test_data_VIGAS_VirulenceFinder_20260307_105756.tsv
    null_values: []
    strip: true
    completion:
      marker: VirulenceFinder_not_in_original_data
      meaning: "Not yet stated by the recipe maker: an added line only says that this entity has no line in this table."
    input_fields: !include '1_test_data_ST22_dummy/input_fields/VirulenceFinder_input_fields.yaml'
    tier1: !include '1_test_data_ST22_dummy/wrangling/VirulenceFinder_wrangling.yaml'
metadata_schema:
  ui_label: "metadata"
  description: "One row per sample with its source, year and country of isolation."
  source:
    type: local_tsv
    path: ./assets/test_data/1_test_data_ST22_dummy/test_metadata_20260307_105756.tsv
  null_values: []
  strip: true
  completion:
    marker: metadata_schema_not_in_original_data
    meaning: "Not yet stated by the recipe maker: an added line only says that this entity has no line in this table."
  input_fields: !include '1_test_data_ST22_dummy/input_fields/metadata_schema_input_fields.yaml'
  tier1:
    steps: []
  tier2:
    steps: []
additional_datasets_schemas:
  APEC_STEC_virulence_genes:
    ui_label: "APEC STEC virulence genes"
    description: "Reference list with one row per virulence gene of interest (APEC and STEC); used to keep only these genes from the VirulenceFinder hits."
    source:
      type: local_tsv
      path: ./assets/ref_data/Virulence_genes_APEC/Virulence_genes_APEC.tsv
    null_values: []
    strip: true
    input_fields: !include '../../../assets/ref_data/Virulence_genes_APEC/Virulence_genes_APEC_input_fields.yaml'
    tier1:
      steps: []
      # strip_whitespace: removed by the migration, it had nothing to act on (no String column at that point)
joins:
  AR1_MLST_Serotype_Virulence:
    ui_label: "AR1 MLST Serotype Virulence"
    description: "One row per sample and selected virulence gene: MLST and metadata, joined to the VirulenceFinder genes that are in the APEC/STEC list (inner join, so a sample with none of these genes has no row)."
    ingredients:
    - dataset_id: MLST
    - dataset_id: metadata_schema
    - dataset_id: VirulenceFinder
    - dataset_id: APEC_STEC_virulence_genes
    tier1: !include '1_test_data_ST22_dummy/wrangling/AR1_MLST_Serotype_Virulence.yaml'
    labels: {"sample_id": "Sample ID", "source": "Biological Source", "year": "Collection Year", "country": "Origin Country", "sequence_type": "MLST Sequence Type", "serotype": "Serotype", "selected_virulence_genes": "Gene (VirulenceFinder)", "vf_protein": "Protein (VirulenceFinder)"}
plot_defaults:
  theme: theme_bw

analysis_groups:
  MLST_Overview:
    ui_label: MLST Overview
    description: "Which sequence types occur, and in which countries and sources."
    plots:
      abromics_st_by_country:
        ui_label: Sequence Types by Country
        description: "Bars count the rows of the table (one per sample and selected virulence gene, so a sample with more genes weighs more) for each sequence type, coloured by country."
        target_dataset: AR1_MLST_Serotype_Virulence
        layers:
        - name: geom_bar
          params: {}
        - name: scale_x_discrete
          params: {}
        - name: labs
          params:
            title: Sequence Types by Country
            x: Sequence Type
            fill: Country
        mapping:
          x: sequence_type
          fill: country
      abromics_st_by_source:
        ui_label: Sequence Types by Source
        description: "Bars count the rows of the table (one per sample and selected virulence gene, so a sample with more genes weighs more) for each sequence type, coloured by source."
        target_dataset: AR1_MLST_Serotype_Virulence
        layers:
        - name: geom_bar
          params: {}
        - name: scale_x_discrete
          params: {}
        - name: labs
          params:
            title: Sequence Types by Source
            x: Sequence Type
            fill: Source
        mapping:
          x: sequence_type
          fill: source
