ui_label: "Plot A Phenotype Bar"
description: "Bars count the rows of the joined table for each antibiotic (mic_id), coloured by predicted phenotype; the joined table repeats every antibiotic test once per resistance gene row of its sample, so a sample with more genes weighs more."
taxonomy: {"family": "Distribution", "pattern": "2 Categorical", "difficulty": "Beginner"}
target_dataset: figshare_triple_join
mapping:
  x: mic_id
  fill: predicted_phenotype
layers:
- name: geom_bar
  params: {}
- name: labs
  params:
    title: Phenotypic Resistance per Antibiotic
