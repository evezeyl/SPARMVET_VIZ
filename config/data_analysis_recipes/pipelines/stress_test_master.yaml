id: stress_test_master
spec_version: 1
data_engine: python-polars
plot_engine: python-plotnine
info:
  label: 'STRESS: Master Performance Baseline'
  contact: "Eve (evezeyl@gmail.com) — contact in case of problems"
  description: Bulletproof stress test data analysis recipe for verifying Tier 3 responsiveness
    and Comparison Theater.
data_schemas:
  Stress_Source:
    label: "Stress Source"
    description: "One row per synthetic record (species, collection date, antibiotic class, value); generated to test speed, not real isolates."
    source:
      type: local_tsv
      path: assets/test_data/STRESS/STRESS_data.tsv
    null_values: []
    strip: true
    input_fields: !include 'stress_test_master/input_fields/Stress_Source_input_fields.yaml'
    wrangling: !include 'stress_test_master/wrangling/Stress_Source_wrangling.yaml'
joins:
  Master_Collection:
    label: "Master Collection"
    description: "The stress table as it is (no join step), kept as the one collection the plot reads."
    ingredients:
    - dataset_id: Stress_Source
    steps: !include 'stress_test_master/wrangling/Master_Collection_steps.yaml'
plot_defaults:
  default_font_family: Liberation Sans
analysis_groups:
  Stress_Distribution:
    label: Distribution Analysis
    description: "How the synthetic records spread over species and antibiotic classes, to test that a large plot stays responsive."
    plots:
      stress_species_amr:
        label: Species x AMR Distribution
        description: "Bars count records for each species, coloured by antibiotic class."
        spec:
          target_dataset: Master_Collection
          layers:
          - name: geom_bar
            params: {}
          - name: labs
            params:
              title: 'STRESS TEST: Species x AMR Distribution'
              x: Species
              y: Observed Count
              fill: AMR Class
          mapping:
            x: species
            fill: amr_class
