ui_label: "AMR Heatmap"
description: "Heatmap showing AMR gene presence across samples."
taxonomy: {"family": "Correlation", "pattern": "1 Numeric, 2 Categorical", "difficulty": "Intermediate"}
target_dataset: ResFinder
tier3:
  steps:
  # an entity with no ResFinder line has no gene: its tile sits under the category NOT DETECTED on the gene axis, not under an empty gene (D-0623).
  # Only this plot's table changes: ResFinder's tier 1 and tier 2 (and the status Not Found they hold) feed other tables and stay as they are.
  - action: polars_fill_null
    columns: [gene]
    value: NOT DETECTED
layers:
- name: geom_tile
  params:
    color: white
    size: 0.1
- name: element_text
  params:
    target: axis_text_x
    angle: 90
    hjust: 1
    vjust: 0.5
    size: 8
- name: element_text
  params:
    target: axis_text_y
    size: 4
- name: theme_minimal
  params: {}
- name: labs
  params:
    title: AMR Genes Presence by Category
mapping:
  x: gene
  y: sample_id
  fill: predicted_phenotype
