ui_label: "Virulence Bar"
description: "One bar per sample counting table rows, coloured by selected virulence gene; the table has one row per sample, virulence gene and AMR gene hit, so a sample with more AMR hits weighs more."
taxonomy: {"family": "Ranking", "pattern": "1 Numeric, 1 Categorical", "difficulty": "Intermediate"}
target_dataset: ST22_Anchor
layers:
- name: theme_minimal
  params: {}
- name: geom_bar
  params:
    stat: count
    width: 0.7
- name: labs
  params:
    title: Selected Virulence Genes Count
    x: Sample Id
    y: Count
    fill: Selected Virulence Genes
- name: element_text
  params:
    target: axis_text_x
    angle: 90
    hjust: 1
    vjust: 0.5
    size: 6
- name: theme_legend_position
  params:
    position: bottom
mapping:
  x: sample_id
  fill: Selected_Virulence_Genes
