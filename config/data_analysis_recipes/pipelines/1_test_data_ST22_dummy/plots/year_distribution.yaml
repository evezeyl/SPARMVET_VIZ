ui_label: "Year Distribution"
description: "Bars count samples (one row per sample) per year, coloured by country. The result (T2) keeps only the years 2023 to 2025; the raw data table (T1) also holds 2022, so compare the two data tables to verify the toggle."
taxonomy: {"family": "Ranking", "pattern": "1 Numeric, 1 Categorical", "difficulty": "Simple"}
target_dataset: MLST_with_metadata
layers:
- name: geom_bar
  params: {}
- name: scale_x_continuous
  params:
    breaks_integer: true
- name: labs
  params:
    title: Sample Count by Year (T1 = all years, T2 = 2023–2025 only)
mapping:
  x: year
  fill: country
