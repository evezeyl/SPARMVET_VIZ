ui_label: "Assembly Quality Dotplot"
description: "One boxplot per assembly measure (N50, total length, largest contig) showing how the values spread over the samples, to see outliers."
taxonomy: {"family": "Distribution", "pattern": "1 Numeric, 1 Categorical", "difficulty": "Intermediate"}
target_dataset: Quast_with_metadata
mapping:
  x: metric
  y: value
  fill: metric
layers:
- name: geom_boxplot
  params: {}
- name: facet_wrap
  params:
    facets: ~metric
    scales: free
- name: labs
  params:
    title: Assembly Quality Metrics (Quast)
