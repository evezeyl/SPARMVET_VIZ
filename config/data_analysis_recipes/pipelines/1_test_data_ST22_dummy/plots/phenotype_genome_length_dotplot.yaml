# Plot Spec: Correlating Resistance Scores with Assembly Quality
# Authoritative Standard: ADR-029a Plot Builder Scope
title: "Phenotype Score correlation with Assembly Metrics"
target_dataset: "Summary_phenotype_length_fragmentation" # Assembly ID from master data analysis recipe
mapping:
  x: "phenotype_count"
  y: "quality_value"
  color: "ST"           # Overlay sequence type for context
layers:
  - name: "geom_point"
    params: {alpha: 0.6, size: 2.5, position: "jitter", random_state: 0} # Jitter X since scores are integers; the seed is written so the arrangement is the same everywhere
  - name: "geom_smooth" # The "Tendence" model suggested by User
    params: {method: "lm", se: true, color: "black", alpha: 0.2}
  - name: "facet_wrap"
    params: {facets: "~ quality_metric", scales: "free_y", ncol: 1} # Free scales since units differ
  - name: "labs"
    params: {x: "Resistance Score (Count of Resistance Phenotypes)", y: "Metric Value"}
