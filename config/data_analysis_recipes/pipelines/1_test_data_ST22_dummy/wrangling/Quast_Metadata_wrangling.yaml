tier1:
  - action: polars_join
    right_ingredient: metadata_schema
    'on': [sample_id]
    how: left
    maintain_order: left_right
  - action: polars_unpivot
    'on': [n50, total_length, largest_contig]
    variable_name: metric
    value_name: value
    index: [sample_id, source, country]
  # Defensive: ensure value is Float64 for geom_violin/boxplot kernel density.
  - action: polars_cast
    columns: [value]
    dtype: Float64


