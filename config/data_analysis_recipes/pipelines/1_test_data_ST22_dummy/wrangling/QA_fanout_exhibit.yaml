# QA canary, an EXHIBIT of a known defect (issue #68): two long tables joined on the same key multiply
# the rows (each AMR gene row meets each virulence gene row of the sample). Do not copy this pattern.
tier1:
  - action: polars_join
    right_ingredient: ResFinder
    'on': [sample_id]
    how: left
    maintain_order: left_right
  - action: polars_join
    right_ingredient: VirulenceFinder
    'on': [sample_id]
    how: left
    maintain_order: left_right
  - action: polars_select
    exprs: [sample_id, country, gene, VF_gene]

tier2:
  - action: polars_group_by
    by: [sample_id]
    maintain_order: true
    named_aggs:
      rows_per_sample: pl.col('VF_gene').count()
