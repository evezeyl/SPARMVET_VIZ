tier1:
  - action: polars_cast
    columns: [sample_id]
    dtype: String

  # RELATIONAL ANCHOR: Master Cross-Dataset Integration
  # Purpose: Create a "Wide" Anchor table with metadata + AMR + MLST + Virulence.

  - action: polars_join
    right_ingredient: FastP
    'on': [sample_id]
    how: left
    maintain_order: left_right

  - action: polars_join
    right_ingredient: ResFinder
    'on': [sample_id]
    how: left
    maintain_order: left_right

  - action: polars_join
    right_ingredient: MLST
    'on': [sample_id]
    how: left
    maintain_order: left_right

  - action: polars_join
    right_ingredient: VirulenceFinder
    'on': [sample_id]
    how: left
    maintain_order: left_right

  # Whitelist virulence genes against APEC STEC reference table (filter + rename)
  - action: polars_join
    right_ingredient: APEC_STEC_virulence_genes
    left_on: [VF_gene]
    right_on: [Gene_name]
    how: inner
    maintain_order: left_right

  - action: polars_rename
    mapping:
      VF_gene: Selected_Virulence_Genes
  # The AMR phenotype of the ResFinder hit was published as `phenotype` by the old contract, whose hidden alias rule
  # is gone: the rename is a step now (ResFinder declares it as `predicted_phenotype`, "Predicted Phenotype").
  - action: polars_rename
    mapping:
      predicted_phenotype: phenotype
    strict: true
  - action: polars_select
    exprs: ["sample_id", "source", "year", "country", "sequence_type", "serotype", "Selected_Virulence_Genes", "VF_protein", "gene", "status", "phenotype"]

# tier2: aggregation / sorting for cross-dataset visualizations
tier2:
  # 1. Provide virulence gene count for sorting
  - action: polars_with_columns
    named_exprs:
      virulence_count: pl.len().over(['sample_id'])

  # 2. Sort samples by virulence count (primary) to highlight high-risk isolates
  - action: polars_sort
    by: [virulence_count, sample_id]
    maintain_order: true
    descending: [true, false]
