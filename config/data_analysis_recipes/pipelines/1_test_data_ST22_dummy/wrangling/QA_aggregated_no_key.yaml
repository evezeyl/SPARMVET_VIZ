# QA canary: a plot built on an AGGREGATE has no sample_id column (issue #60, forensics F1).
# T1 keeps one row per sample, with sample_id. T2 is one row per country and year with the number of samples,
# so sample_id is gone. An audit step that removes a sample by its ID can act on T1 but has nothing to act on
# in T2: this is the fixture for the reach tests of the audit design.
tier1:
  - action: "mutate"
    column: "year_label"
    expression: "pl.col('year').cast(pl.Int64).cast(pl.String)"

tier2:
  # count() counts the non-empty sample_id values of each group.
  - action: "summarize"
    columns: ["sample_id"]
    group_by: ["country", "year_label"]
    agg: "count"
    new_name: "n_samples"
