tier1:
- action: polars_join
  right_ingredient: metadata_schema
  'on': [sample_id]
  how: left
  maintain_order: left_right
# DATA-2 (2026-04-30): purposeful T2 transforms so users can SEE the
# T1 → T2 difference when toggling the tier in the UI.
tier2:
- action: polars_with_columns
  named_exprs:
    era: pl.when(pl.col('year') < 2024).then(pl.lit('Early')).otherwise(pl.lit('Recent'))
- action: modif_filter
  column: year
  op: between
  value: [2023, 2025]
  na: remove
