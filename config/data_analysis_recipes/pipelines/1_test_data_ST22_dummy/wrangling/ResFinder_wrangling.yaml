tier1:
  - action: polars_with_columns
    named_exprs:
      status: pl.lit('Detected')

tier2:
  # Calculate total gene count per sample for sorting purposes
  - action: polars_with_columns
    named_exprs:
      total_gene_count: pl.len().over(['sample_id'])

  # Sort primarily by total count (to see most resistant isolates together)
  - action: polars_sort
    by: [total_gene_count, sample_id]
    maintain_order: true
    descending: [true, false]
