# @deps
# provides: data analysis recipe:2_test_data_ST22_dummy
# consumes: config/data_analysis_recipes/pipelines/2_test_data_ST22_dummy/assembly/AMR_Profile_Joint.yaml (via !include)
# consumes: config/data_analysis_recipes/pipelines/2_test_data_ST22_dummy/assembly/Plasmid_Profile_Joint.yaml (via !include)
# consumed_by: app/src/server.py (via bootloader), libs/transformer/tests/debug_assembler.py, libs/viz_factory/tests/debug_gallery.py
# doc: .claude/rules/rules_data_analysis_recipe_structure.md
# @end_deps

# ADR-041: SPARMVET Consolidated Lineage Data Analysis Recipe
# Sequential Build: 2_test_data_ST22_dummy
# Date: 2026-04-23

id: 2_test_data_ST22_dummy
spec_version: 1
data_engine: python-polars
plot_engine: python-plotnine
info:
  ui_label: "ST22 analysis lineage (sequential build)"
  description: "Improved ST22 Analysis Lineage - Sequential Build"
  contact: "Eve (evezeyl@gmail.com) — contact in case of problems"

metadata_schema:
  ui_label: "metadata"
  description: "One row per sample with its source, year and country of isolation."
  source:
    type: "local_tsv"
    path: "assets/test_data/1_test_data_ST22_dummy/test_metadata_20260307_105756.tsv"
  null_values: []
  strip: true
  completion:
    marker: metadata_schema_not_in_original_data
    meaning: "Not yet stated by the recipe maker: an added line only says that this entity has no line in this table."
  input_fields: !include 2_test_data_ST22_dummy/input_fields/metadata_schema.yaml
  tier1: {steps: []}

data_schemas:
  amr_data:
    ui_label: "amr data"
    description: "One row per resistance gene hit reported by ResFinder (a sample can have several); only hits with identity of at least 90 and overlap of at least 60 percent are kept."
    source:
      type: "local_tsv"
      path: "assets/test_data/1_test_data_ST22_dummy/test_data_ResFinder_20260307_105756.tsv"
    null_values: []
    strip: true
    completion:
      marker: amr_data_not_in_original_data
      meaning: "Not yet stated by the recipe maker: an added line only says that this entity has no line in this table."
    input_fields: !include 2_test_data_ST22_dummy/input_fields/amr_data.yaml
    tier1: !include 2_test_data_ST22_dummy/wrangling/amr_data.yaml
  plasmid_data:
    ui_label: "plasmid data"
    description: "One row per plasmid hit reported by PlasmidFinder (a sample can have several); only hits with identity of at least 90 and overlap of at least 60 percent are kept."
    source:
      type: "local_tsv"
      path: "assets/test_data/1_test_data_ST22_dummy/test_data_PlasmidFinder_20260307_105756.tsv"
    null_values: []
    strip: true
    completion:
      marker: plasmid_data_not_in_original_data
      meaning: "Not yet stated by the recipe maker: an added line only says that this entity has no line in this table."
    input_fields: !include 2_test_data_ST22_dummy/input_fields/plasmid_data.yaml
    tier1: !include 2_test_data_ST22_dummy/wrangling/plasmid_data.yaml

joins:
  AMR_Profile_Joint:
    ui_label: "AMR Profile Joint"
    description: "One row per resistance gene hit with the sample's source, year and country (left join with the metadata: a sample with no hit has no row), and the flag Multiresistant that is Yes when the hits of the sample name more than one distinct predicted phenotype (a drug, not a drug class; a missing phenotype is not counted, because missing here means that no resistance phenotype has been detected)."
    ingredients:
      - dataset_id: amr_data
      - dataset_id: metadata_schema
    tier1: !include 2_test_data_ST22_dummy/assembly/AMR_Profile_Joint.yaml
  Plasmid_Profile_Joint:
    ui_label: "Plasmid Profile Joint"
    description: "One row per plasmid hit with the sample's source, year and country (left join with the metadata: a sample with no plasmid hit has no row), sorted by year, source and country."
    ingredients:
      - dataset_id: plasmid_data
      - dataset_id: metadata_schema
    tier1: !include 2_test_data_ST22_dummy/assembly/Plasmid_Profile_Joint.yaml

analysis_groups:
  AMR_Insight:
    ui_label: "AMR Profiling Insight"
    description: "How many resistance gene hits come from multi-resistant samples, by year, country and source."
    plots:
      multi_resistance_by_country: !include 2_test_data_ST22_dummy/plots/multi_resistance_by_country.yaml
      multi_resistance_by_source: !include 2_test_data_ST22_dummy/plots/multi_resistance_by_source.yaml
  Plasmid_Insight:
    ui_label: "Plasmid Dynamics"
    description: "Which plasmid types are found, by year and country."
    plots:
      plasmid_prevalence_by_country: !include 2_test_data_ST22_dummy/plots/plasmid_counts_by_year.yaml
