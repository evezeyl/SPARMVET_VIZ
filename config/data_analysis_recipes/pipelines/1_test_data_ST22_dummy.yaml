id: 1_test_data_ST22_dummy
spec_version: 1
data_engine: python-polars
plot_engine: python-plotnine
info:
  label: ST22 Dummy Dataset
  contact: "Eve (evezeyl@gmail.com) — contact in case of problems"
  subtitle: E. coli ST22 — AMR & Virulence Research (demo)   # optional — shown under title in Home
  category: AMR Research
  description: Hyper-modular data analysis recipe structure with dedicated subdirectories and
    annotated assembly steps.
  version: '1.8'

# ── Data Schemas ──────────────────────────────────────────────────────────────
# Fragment files: 1_test_data_ST22_dummy/{input_fields,wrangling,output_fields}/
data_schemas:
  Summary:
    label: "Summary"
    description: "Pipeline Summary (Globally pipeline Summary)"
    source:
      type: local_tsv
      path: ./assets/test_data/1_test_data_ST22_dummy/test_data_Summary_20260307_105756.tsv
    null_values: []
    strip: true
    input_fields: !include '1_test_data_ST22_dummy/input_fields/Summary_input_fields.yaml'
    wrangling: !include '1_test_data_ST22_dummy/wrangling/Summary_wrangling.yaml'

  Summary_quality:
    label: "Summary quality"
    source:
      type: local_tsv
      path: ./assets/test_data/1_test_data_ST22_dummy/test_data_Summary_20260307_105756.tsv
    null_values: []
    strip: true
    input_fields: !include '1_test_data_ST22_dummy/input_fields/Summary_input_fields.yaml'
    wrangling:
      tier1: []
      tier2: []

  Quality_metrics:
    label: "Quality metrics"
    description: "Summary Quality metrics Reads and Assembly (Quality Control)"
    source:
      type: local_tsv
      path: ./assets/test_data/1_test_data_ST22_dummy/test_data_Quality_metrics_20260307_105756.tsv
    null_values: []
    strip: true
    input_fields: !include '1_test_data_ST22_dummy/input_fields/Quality_metrics_input_fields.yaml'
    wrangling: {tier1: []}

  Detailed_summary:
    label: "Detailed summary"
    description: "AMR gene / predicted phenotype detection  - summary (Gene detection)"
    comment: "Filtered by % identity > 90 and % overlap > 85 Reason and legnth ratio > 0.8 assume true values"
    source:
      type: local_tsv
      path: ./assets/test_data/1_test_data_ST22_dummy/test_data_Detailed_Summary_20260307_105756.tsv
    null_values: []
    strip: true
    input_fields: !include '1_test_data_ST22_dummy/input_fields/Detailed_summary_input_fields.yaml'
    wrangling: !include '1_test_data_ST22_dummy/wrangling/Detailed_summary_wrangling.yaml'

  FastP:
    label: "FastP"
    description: "Reads Quality (Quality Control)"
    source:
      type: local_tsv
      path: ./assets/test_data/1_test_data_ST22_dummy/test_data_FastP_20260307_105756.tsv
    null_values: []
    strip: true
    input_fields: !include '1_test_data_ST22_dummy/input_fields/FastP_input_fields.yaml'
    wrangling: !include '1_test_data_ST22_dummy/wrangling/FastP_wrangling.yaml'

  Quast:
    label: "Quast"
    description: "Assembly Quality (Quality Control)"
    source:
      type: local_tsv
      path: ./assets/test_data/1_test_data_ST22_dummy/test_data_Quast_20260307_105756.tsv
    null_values: []
    strip: true
    input_fields: !include '1_test_data_ST22_dummy/input_fields/Quast_input_fields.yaml'
    wrangling: !include '1_test_data_ST22_dummy/wrangling/Quast_wrangling.yaml'

  Bracken:
    label: "Bracken"
    description: "Reads Taxonomic classification (Quality Control)"
    source:
      type: local_tsv
      path: ./assets/test_data/1_test_data_ST22_dummy/test_data_Bracken_20260307_105756.tsv
    null_values: []
    strip: true
    input_fields: !include '1_test_data_ST22_dummy/input_fields/Bracken_input_fields.yaml'
    wrangling: !include '1_test_data_ST22_dummy/wrangling/Bracken_wrangling.yaml'

  ResFinder:
    label: "ResFinder"
    description: "AMR gene detection (Gene detection)"
    source:
      type: local_tsv
      path: ./assets/test_data/1_test_data_ST22_dummy/test_data_ResFinder_20260307_105756.tsv
    null_values: []
    strip: true
    input_fields: !include '1_test_data_ST22_dummy/input_fields/ResFinder_input_fields.yaml'
    wrangling: !include '1_test_data_ST22_dummy/wrangling/ResFinder_wrangling.yaml'

  MLST:
    label: "MLST"
    description: "Multilocus Typing (Strain Classification)"
    source:
      type: local_tsv
      path: ./assets/test_data/1_test_data_ST22_dummy/test_data_MLST_results_20260307_105756.tsv
    null_values: []
    strip: true
    input_fields: !include '1_test_data_ST22_dummy/input_fields/MLST_input_fields.yaml'
    wrangling: !include '1_test_data_ST22_dummy/wrangling/MLST_wrangling.yaml'

# ── Additional Datasets ───────────────────────────────────────────────────────
additional_datasets_schemas:
  VirulenceFinder:
    label: "VirulenceFinder"
    description: "VirulenceFinder (Gene detection)"
    source:
      type: local_tsv
      path: ./assets/test_data/2_VIGAS-P_ST22_dummy/test_data_VIGAS_VirulenceFinder_20260307_105756.tsv
    null_values: []
    strip: true
    input_fields: !include '1_test_data_ST22_dummy/input_fields/VirulenceFinder_input_fields.yaml'
    wrangling: !include '1_test_data_ST22_dummy/wrangling/VirulenceFinder_wrangling.yaml'

  APEC_STEC_virulence_genes:
    label: "APEC STEC virulence genes"
    description: "VirulenceFinder Reference dataset (Gene detection)"
    comment: "Virulence types of interest for STEC"
    source:
      type: local_tsv
      path: ./assets/ref_data/Virulence_genes_APEC/Virulence_genes_APEC.tsv
    null_values: []
    strip: true
    input_fields: !include '1_test_data_ST22_dummy/input_fields/APEC_STEC_virulence_genes_input_fields.yaml'
    wrangling:
      tier1:
        # strip_whitespace: removed by the migration, it had nothing to act on (no String column at that point)

# ── Metadata Schema ───────────────────────────────────────────────────────────
metadata_schema:
  label: "metadata"
  description: "Metadata (Metadata)"
  source:
    type: local_tsv
    path: ./assets/test_data/1_test_data_ST22_dummy/test_metadata_20260307_105756.tsv
  null_values: []
  strip: true
  input_fields: !include '1_test_data_ST22_dummy/input_fields/metadata_schema_input_fields.yaml'
  wrangling: !include '1_test_data_ST22_dummy/wrangling/metadata_schema_wrangling.yaml'

# ── Assembly Data Analysis Recipes ────────────────────────────────────────────────────────
# Simple joins: see wrangling/ for each step list.
# Complex assemblies (ST22_Anchor, AR1) also have final_contract in output_fields/.
joins:
  FastP_with_metadata:
    label: "FastP with metadata"
    ingredients:
    - dataset_id: FastP
    - dataset_id: metadata_schema
    steps: !include '1_test_data_ST22_dummy/wrangling/FastP_Metadata_wrangling.yaml'

  Quast_with_metadata:
    label: "Quast with metadata"
    ingredients:
    - dataset_id: Quast
    - dataset_id: metadata_schema
    steps: !include '1_test_data_ST22_dummy/wrangling/Quast_Metadata_wrangling.yaml'

  Bracken_with_metadata:
    label: "Bracken with metadata"
    ingredients:
    - dataset_id: Bracken
    - dataset_id: metadata_schema
    steps: !include '1_test_data_ST22_dummy/wrangling/Bracken_Metadata_wrangling.yaml'

  ResFinder_with_metadata:
    label: "ResFinder with metadata"
    ingredients:
    - dataset_id: ResFinder
    - dataset_id: metadata_schema
    steps: !include '1_test_data_ST22_dummy/wrangling/ResFinder_Metadata_wrangling.yaml'

  MLST_with_metadata:
    label: "MLST with metadata"
    ingredients:
    - dataset_id: MLST
    - dataset_id: metadata_schema
    steps: !include '1_test_data_ST22_dummy/wrangling/MLST_Metadata_wrangling.yaml'

  QC_Reads_Anchor:
    label: "QC Reads Anchor"
    ingredients:
    - dataset_id: FastP
    - dataset_id: Quast
    - dataset_id: Bracken
    - dataset_id: metadata_schema
    steps: !include '1_test_data_ST22_dummy/wrangling/QC_Reads_Anchor_wrangling.yaml'

  Summary_phenotype_length_fragmentation:
    label: "Summary phenotype length fragmentation"
    description: "Demo: Assembly to prepare plot attempting to link some predicted phenotype categories to some quality metrics. in relation to genome length, and fragmentation (higher number of contigs and lower N50 value)"
    ingredients:
    - dataset_id: Summary
    - dataset_id: Summary_quality
    steps: !include '1_test_data_ST22_dummy/assembly/Summary_phenotype_length_fragmentation_assembly.yaml'

  ST22_Anchor:
    label: "ST22 Anchor"
    description: Primary joined dataset for ST22 Dummy analysis.
    ingredients:
    - dataset_id: metadata_schema
    - dataset_id: FastP
    - dataset_id: ResFinder
    - dataset_id: MLST
    - dataset_id: VirulenceFinder
    - dataset_id: APEC_STEC_virulence_genes
    steps: !include '1_test_data_ST22_dummy/wrangling/ST22_Anchor_wrangling.yaml'
    labels: {"sample_id": "Sample ID", "source": "Biological Source", "year": "Collection Year", "country": "Origin Country", "sequence_type": "MLST Sequence Type", "serotype": "Serotype", "Selected_Virulence_Genes": "Gene (VirulenceFinder)", "VF_protein": "Protein (VirulenceFinder)", "gene": "AMR Gene", "status": "Phenotype Status", "phenotype": "AMR Class / Phenotype"}

  AR1_MLST_Serotype_Virulence:
    label: "AR1 MLST Serotype Virulence"
    description: Production-grade Sample-to-Gene Mapping (Abromics Pilot).
    ingredients:
    - dataset_id: MLST
    - dataset_id: metadata_schema
    - dataset_id: VirulenceFinder
    - dataset_id: APEC_STEC_virulence_genes
    steps: !include '1_test_data_ST22_dummy/wrangling/AR1_MLST_Serotype_Virulence.yaml'
    labels: {"sample_id": "Sample ID", "source": "Biological Source", "year": "Collection Year", "country": "Origin Country", "sequence_type": "MLST Sequence Type", "serotype": "Serotype", "selected_virulence_genes": "Gene (VirulenceFinder)", "vf_protein": "Protein (VirulenceFinder)"}

  # QA canaries: one collection per failure mode, expected numbers are in `wrangling/QA_*.yaml` and `plots/qa_*.yaml`
  QA_AMR_per_sample:
    label: "QA AMR per sample"
    description: QA canary - samples without an AMR gene must stay (long T1, one row per sample in T2).
    ingredients:
    - dataset_id: metadata_schema
    - dataset_id: ResFinder
    steps: !include '1_test_data_ST22_dummy/wrangling/QA_AMR_per_sample.yaml'

  QA_ST_with_NA:
    label: "QA ST with NA"
    description: QA canary - a missing sequence type must stay visible as missing.
    ingredients:
    - dataset_id: Summary_quality
    steps: !include '1_test_data_ST22_dummy/wrangling/QA_ST_with_NA.yaml'

  QA_year_types:
    label: "QA year types"
    description: QA canary - year as a number and as a label without ".0".
    ingredients:
    - dataset_id: metadata_schema
    steps: !include '1_test_data_ST22_dummy/wrangling/QA_year_types.yaml'

  QA_L50_integer:
    label: "QA L50 integer"
    description: QA canary - an integer column for threshold filters.
    ingredients:
    - dataset_id: Quast
    steps: !include '1_test_data_ST22_dummy/wrangling/QA_L50_integer.yaml'

  QA_fanout_exhibit:
    label: "QA fanout exhibit"
    description: QA canary, EXHIBIT of a known defect - two long tables joined on one key (issue #68).
    ingredients:
    - dataset_id: metadata_schema
    - dataset_id: ResFinder
    - dataset_id: VirulenceFinder
    steps: !include '1_test_data_ST22_dummy/wrangling/QA_fanout_exhibit.yaml'

  QA_aggregated_no_key:
    label: "QA aggregated no key"
    description: QA canary - T2 is an aggregate without sample_id, so a sample cannot be removed from it by its ID (issue #60).
    ingredients:
    - dataset_id: metadata_schema
    steps: !include '1_test_data_ST22_dummy/wrangling/QA_aggregated_no_key.yaml'

  QA_population_zscore:
    label: "QA population zscore"
    description: QA canary - a z-score across samples, so a sample removed before the step changes every other sample (audit placement rule).
    ingredients:
    - dataset_id: metadata_schema
    - dataset_id: Quast
    steps: !include '1_test_data_ST22_dummy/wrangling/QA_population_zscore.yaml'

# ── Analysis Groups ───────────────────────────────────────────────────────────
# Plot specs: see plots/ for each spec file.
analysis_groups:
  Quality Control:
    label: "📊 Quality Control"
    description: 📊 Quality Control
    plots:
      qc_reads_horizontal_barplot:
        label: "Qc Reads Horizontal Barplot"
        taxonomy: {"family": "Distribution", "pattern": "1 Numeric, 2 Categorical", "difficulty": "Intermediate"}
        description: "Provides a distribution of total reads per sample by taxonomy proportion. Shows total reads (FastP) colored by the proportion of the top-ranking taxon (Bracken)."
        spec: !include '1_test_data_ST22_dummy/plots/FastP_reads_horizontal_barplot.yaml'
      assembly_quality_dotplot:
        label: "Assembly Quality Dotplot"
        taxonomy: {"family": "Distribution", "pattern": "1 Numeric, 1 Categorical", "difficulty": "Intermediate"}
        description: "Provides a distribution of assembly quality metrics per sample. Facetted boxplot to identify assembly outliers across metrics (N50, Length, etc.)."
        spec: !include '1_test_data_ST22_dummy/plots/Quast_assembly_quality_barplot.yaml'

  Curiosity:
    label: "❓ Curiosity plots"
    description: ❓ Curiosity plots
    plots:
      phenotype_genome_length_fragmentation:
        label: "Phenotype Genome Length Fragmentation"
        description: "Provides a distribution of genome length per sample by phenotype."
        spec: !include '1_test_data_ST22_dummy/plots/phenotype_genome_length_dotplot.yaml'

  Results:
    label: "💊 AMR and ☠️ Virulence"
    description: 💊 AMR and ☠️ Virulence
    plots:
      amr_heatmap:
        label: "Amr Heatmap"
        taxonomy: {"family": "Correlation", "pattern": "1 Numeric, 2 Categorical", "difficulty": "Intermediate"}
        description: "Heatmap showing AMR gene presence across samples."
        spec: !include '1_test_data_ST22_dummy/plots/ResFinder_genes_heatmap.yaml'
      virulence_bar:
        label: "Virulence Bar"
        taxonomy: {"family": "Ranking", "pattern": "1 Numeric, 1 Categorical", "difficulty": "Intermediate"}
        description: "Bar chart counting selected virulence genes."
        spec: !include '1_test_data_ST22_dummy/plots/VirulenceFinder_counts_bar.yaml'
      mlst_bar:
        label: "Mlst Bar"
        taxonomy: {"family": "Ranking", "pattern": "2 Categorical", "difficulty": "Simple"}
        description: "Bar chart showing frequency of sequence types by territory. Bar chart showing the frequency of MLST sequence types, filled by the origin country."
        spec: !include '1_test_data_ST22_dummy/plots/MLST_counts_bar.yaml'
      year_distribution:
        label: "Year Distribution"
        taxonomy: {"family": "Ranking", "pattern": "1 Numeric, 1 Categorical", "difficulty": "Simple"}
        description: "T1/T2 tier-toggle test: T1 shows all years, T2 filters to 2023-2025 only. Missing bars prove the toggle works. Use this plot to verify T1↔T2 toggle. T2 drops rows outside 2023-2025 — earlier years disappear."
        spec: !include '1_test_data_ST22_dummy/plots/year_distribution.yaml'
      virulence_variants:
        label: "Virulence Variants"
        taxonomy: {"family": "Correlation", "pattern": "2 Categorical", "difficulty": "Advanced"}
        description: "Integration plot showing AMR + Virulence + MLST. Heatmap showing the distribution of whitelisted virulence genes, facetted by the MLST sequence type."
        spec: !include '1_test_data_ST22_dummy/plots/integration_plot.yaml'

  Cat 🐱:
    label: "🐱 Cat"
    description: The boss's favourite — violin plots
    plots:
      miaou:
        label: "Miaou 🐈"
        taxonomy: {"family": "Distribution", "pattern": "1 Numeric, 1 Categorical", "difficulty": "Intermediate"}
        description: "Miaou! Distribution of assembly metrics across sources — the boss's favourite shape. Violin plot showing the distribution of n50, total_length, and largest_contig per source, facetted by metric. Wide bellies = wide spread, narrow tails = consistent values."
        spec: !include '1_test_data_ST22_dummy/plots/miaou.yaml'

  QA Canaries:
    label: "QA canaries (not for publication): each plot isolates one failure mode; the expected numbers are in its title"
    description: "QA canaries (not for publication): each plot isolates one failure mode; the expected numbers are in its title"
    plots:
      qa_amr_genes_per_sample:
        label: "Qa Amr Genes Per Sample"
        taxonomy: {"family": "Distribution", "pattern": "1 Numeric", "difficulty": "Simple"}
        description: "Samples without an AMR gene must stay (long T1, one row per sample in T2). Canary for samples that vanish from a long table. A sample without any AMR gene must appear at 0, not disappear. T1 is long (74 rows), T2 has one row per sample (42)."
        spec: !include '1_test_data_ST22_dummy/plots/qa_amr_genes_per_sample.yaml'
      qa_sequence_type_missing:
        label: "Qa Sequence Type Missing"
        taxonomy: {"family": "Ranking", "pattern": "1 Categorical", "difficulty": "Simple"}
        description: "A missing sequence type must stay visible as missing. Canary for missing values. The 2 samples without a sequence type must be visible as missing, not dropped and not filled."
        spec: !include '1_test_data_ST22_dummy/plots/qa_sequence_type_missing.yaml'
      qa_year_label:
        label: "Qa Year Label"
        taxonomy: {"family": "Ranking", "pattern": "1 Categorical", "difficulty": "Simple"}
        description: "The year label has no \".0\"; the numeric year stays numeric. Canary for types. The text label of the year has no \".0\"; the numeric year column stays numeric for range filters."
        spec: !include '1_test_data_ST22_dummy/plots/qa_year_label.yaml'
      qa_l50_integer:
        label: "Qa L50 Integer"
        taxonomy: {"family": "Distribution", "pattern": "1 Numeric", "difficulty": "Simple"}
        description: "Integer column for threshold filters (L50 >= 8.5 must keep 9, not 8). Canary for thresholds on an integer column. A filter \"L50 >= 8.5\" must remove the bar at 8 and keep 9; \"L50 < 8.5\" must keep 8."
        spec: !include '1_test_data_ST22_dummy/plots/qa_l50_integer.yaml'
      qa_facet_by_mapping:
        label: "Qa Facet By Mapping"
        taxonomy: {"family": "Ranking", "pattern": "1 Categorical, 1 Categorical", "difficulty": "Simple"}
        description: "facet_by written in mapping must give 3 panels. Canary for the documented spelling of facets. The panels must exist; if the plot has a single panel, facet_by in mapping is being ignored (issue"
        spec: !include '1_test_data_ST22_dummy/plots/qa_facet_by_mapping.yaml'
      qa_fanout_rows_per_sample:
        label: "Qa Fanout Rows Per Sample"
        taxonomy: {"family": "Ranking", "pattern": "1 Numeric, 1 Categorical", "difficulty": "Simple"}
        description: "EXHIBIT of a known defect (issue 68) - rows are inflated on purpose. Exhibit of a known defect. Each sample has as many rows as AMR genes times virulence genes. The many-to-many join check (issue"
        spec: !include '1_test_data_ST22_dummy/plots/qa_fanout_rows_per_sample.yaml'
      qa_aggregated_no_key:
        label: "Qa Aggregated No Key"
        taxonomy: {"family": "Comparison", "pattern": "1 Numeric, 2 Categorical", "difficulty": "Simple"}
        description: "Data of this plot is an aggregate with no sample_id column (issue 60). Canary for the audit reach. The data of this plot is an aggregate with no sample_id column, so removing a sample by its ID cannot change it."
        spec: !include '1_test_data_ST22_dummy/plots/qa_aggregated_no_key.yaml'
      qa_population_zscore:
        label: "Qa Population Zscore"
        taxonomy: {"family": "Distribution", "pattern": "1 Numeric, 1 Categorical", "difficulty": "Simple"}
        description: "A z-score across all samples, the case where the place of a removal changes the numbers of the other samples. Canary for the audit placement rule. The z-score of each sample is computed across all 42 samples, so removing a sample before this step changes every other value."
        spec: !include '1_test_data_ST22_dummy/plots/qa_population_zscore.yaml'

plot_defaults:
  theme: theme_minimal
  default_font_family: "Liberation Sans"
