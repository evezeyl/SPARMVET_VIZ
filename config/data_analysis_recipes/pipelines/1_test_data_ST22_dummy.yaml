  Summary_quality:
    ui_label: "Summary quality"
    description: "The same file as Summary, read as one row per sample with its quality columns (quality module, main taxon, genotype, phenotypes, plasmid, ST, genome length, N50, contigs), so the phenotype counts can be joined to the quality values."
    source:
      type: local_tsv
      path: ./assets/test_data/1_test_data_ST22_dummy/test_data_Summary_20260307_105756.tsv
    null_values: []
    strip: true
    completion:
      marker: Summary_quality_not_in_original_data
      meaning: no result for this entity
    input_fields: !include '1_test_data_ST22_dummy/input_fields/Summary_input_fields.yaml'
    tier1:
      steps: []
    tier2:
      steps: []

  Quality_metrics:
    ui_label: "Quality metrics"
    description: "Summary Quality metrics Reads and Assembly (Quality Control)"
    source:
      type: local_tsv
      path: ./assets/test_data/1_test_data_ST22_dummy/test_data_Quality_metrics_20260307_105756.tsv
    null_values: []
    strip: true
    completion:
      marker: Quality_metrics_not_in_original_data
      meaning: no result for this entity
    input_fields: !include '1_test_data_ST22_dummy/input_fields/Quality_metrics_input_fields.yaml'
    tier1: {steps: []}

  Detailed_summary:
    ui_label: "Detailed summary"
