  Results:
    ui_label: "💊 AMR and ☠️ Virulence"
    description: 💊 AMR and ☠️ Virulence
    plots:
      amr_heatmap: !include 1_test_data_ST22_dummy/plots/ResFinder_genes_heatmap.yaml
      virulence_bar: !include 1_test_data_ST22_dummy/plots/VirulenceFinder_counts_bar.yaml
      mlst_bar: !include 1_test_data_ST22_dummy/plots/MLST_counts_bar.yaml
      year_distribution: !include 1_test_data_ST22_dummy/plots/year_distribution.yaml
