# ── Additional Datasets ───────────────────────────────────────────────────────
additional_datasets_schemas:
  VirulenceFinder:
    ui_label: "VirulenceFinder"
    description: "VirulenceFinder (Gene detection)"
    source:
      type: local_tsv
      path: ./assets/test_data/2_VIGAS-P_ST22_dummy/test_data_VIGAS_VirulenceFinder_20260307_105756.tsv
    null_values: []
    strip: true
    input_fields: !include '1_test_data_ST22_dummy/input_fields/VirulenceFinder_input_fields.yaml'
    tier1: !include '1_test_data_ST22_dummy/wrangling/VirulenceFinder_wrangling.yaml'

  APEC_STEC_virulence_genes:
    ui_label: "APEC STEC virulence genes"
    description: "VirulenceFinder Reference dataset (Gene detection)"
    comment: "Virulence types of interest for STEC"
    source:
      type: local_tsv
      path: ./assets/ref_data/Virulence_genes_APEC/Virulence_genes_APEC.tsv
    null_values: []
    strip: true
    input_fields: !include '1_test_data_ST22_dummy/input_fields/APEC_STEC_virulence_genes_input_fields.yaml'
    tier1:
      steps: []
        # strip_whitespace: removed by the migration, it had nothing to act on (no String column at that point)

# ── Metadata Schema ───────────────────────────────────────────────────────────
metadata_schema:
  ui_label: "metadata"
  description: "Metadata (Metadata)"
  source:
    type: local_tsv
    path: ./assets/test_data/1_test_data_ST22_dummy/test_metadata_20260307_105756.tsv
  null_values: []
  strip: true
  completion:
    marker: not_in_metadata
    meaning: no metadata for this entity
  input_fields: !include '1_test_data_ST22_dummy/input_fields/metadata_schema_input_fields.yaml'
  tier1: !include '1_test_data_ST22_dummy/wrangling/metadata_schema_wrangling.yaml'

# ── Assembly Data Analysis Recipes ────────────────────────────────────────────────────────
# Simple joins: see wrangling/ for each step list.
# Complex assemblies (ST22_Anchor, AR1) also have final_contract in output_fields/.
joins:
  FastP_with_metadata:
    ui_label: "FastP with metadata"
    description: "One row per sample: the FastP read-quality values with the sample's source, year and country; a left join on the sample id, so every FastP sample stays."
    ingredients:
    - dataset_id: FastP
    - dataset_id: metadata_schema
    tier1: !include '1_test_data_ST22_dummy/wrangling/FastP_Metadata_wrangling.yaml'

  Quast_with_metadata:
    ui_label: "Quast with metadata"
    description: "One row per sample and assembly measure (N50, total length, largest contig): a left join with the metadata, then the three measure columns turned into rows so the plots can facet by measure."
    ingredients:
    - dataset_id: Quast
    - dataset_id: metadata_schema
    tier1: !include '1_test_data_ST22_dummy/wrangling/Quast_Metadata_wrangling.yaml'

  Bracken_with_metadata:
    ui_label: "Bracken with metadata"
    description: "One row per sample: the main taxon found by Bracken and its proportion, with the sample's source, year and country (left join)."
    ingredients:
    - dataset_id: Bracken
    - dataset_id: metadata_schema
    tier1: !include '1_test_data_ST22_dummy/wrangling/Bracken_Metadata_wrangling.yaml'

  ResFinder_with_metadata:
    ui_label: "ResFinder with metadata"
    description: "One row per resistance gene hit in a sample, with the sample's source, year and country; a left join from the hits, so a sample with no hit has no row."
    ingredients:
    - dataset_id: ResFinder
    - dataset_id: metadata_schema
    tier1: !include '1_test_data_ST22_dummy/wrangling/ResFinder_Metadata_wrangling.yaml'

  MLST_with_metadata:
    ui_label: "MLST with metadata"
    description: "One row per sample: sequence type with source, year and country (left join); the second stage keeps only the years 2023 to 2025 and adds an era (Early before 2024, Recent from 2024)."
    ingredients:
    - dataset_id: MLST
    - dataset_id: metadata_schema
    tier1: !include '1_test_data_ST22_dummy/wrangling/MLST_Metadata_wrangling_tier1.yaml'
    tier2: !include '1_test_data_ST22_dummy/wrangling/MLST_Metadata_wrangling_tier2.yaml'

  QC_Reads_Anchor:
    ui_label: "QC Reads Anchor"
    description: "One row per sample with read quality (FastP), assembly quality (Quast), main taxon (Bracken) and source, year, country; three left joins on the sample id, so every FastP sample stays."
    ingredients:
    - dataset_id: FastP
    - dataset_id: Quast
    - dataset_id: Bracken
    - dataset_id: metadata_schema
    tier1: !include '1_test_data_ST22_dummy/wrangling/QC_Reads_Anchor_wrangling.yaml'

  Summary_phenotype_length_fragmentation:
    ui_label: "Summary phenotype length fragmentation"
    description: "Demo: Assembly to prepare plot attempting to link some predicted phenotype categories to some quality metrics. in relation to genome length, and fragmentation (higher number of contigs and lower N50 value)"
    ingredients:
    - dataset_id: Summary
    - dataset_id: Summary_quality
    tier1: !include '1_test_data_ST22_dummy/assembly/Summary_phenotype_length_fragmentation_assembly.yaml'

  ST22_Anchor:
    ui_label: "ST22 Anchor"
    description: "One row per sample, selected virulence gene and AMR gene hit (a sample with no AMR hit counts as one hit): metadata, FastP, ResFinder, MLST and VirulenceFinder joined, then only the genes of the APEC/STEC list kept (inner join)."
    ingredients:
    - dataset_id: metadata_schema
    - dataset_id: FastP
    - dataset_id: ResFinder
    - dataset_id: MLST
    - dataset_id: VirulenceFinder
    - dataset_id: APEC_STEC_virulence_genes
    tier1: !include '1_test_data_ST22_dummy/wrangling/ST22_Anchor_wrangling_tier1.yaml'
    tier2: !include '1_test_data_ST22_dummy/wrangling/ST22_Anchor_wrangling_tier2.yaml'
    labels: {"sample_id": "Sample ID", "source": "Biological Source", "year": "Collection Year", "country": "Origin Country", "sequence_type": "MLST Sequence Type", "serotype": "Serotype", "Selected_Virulence_Genes": "Gene (VirulenceFinder)", "VF_protein": "Protein (VirulenceFinder)", "gene": "AMR Gene", "status": "Phenotype Status", "phenotype": "AMR Class / Phenotype"}

  AR1_MLST_Serotype_Virulence:
    ui_label: "AR1 MLST Serotype Virulence"
    description: Production-grade Sample-to-Gene Mapping (Abromics Pilot).
    ingredients:
    - dataset_id: MLST
    - dataset_id: metadata_schema
    - dataset_id: VirulenceFinder
    - dataset_id: APEC_STEC_virulence_genes
    tier1: !include '1_test_data_ST22_dummy/wrangling/AR1_MLST_Serotype_Virulence.yaml'
    labels: {"sample_id": "Sample ID", "source": "Biological Source", "year": "Collection Year", "country": "Origin Country", "sequence_type": "MLST Sequence Type", "serotype": "Serotype", "selected_virulence_genes": "Gene (VirulenceFinder)", "vf_protein": "Protein (VirulenceFinder)"}

  # QA canaries: one collection per failure mode, expected numbers are in `wrangling/QA_*.yaml` and `plots/qa_*.yaml`
  QA_AMR_per_sample:
    ui_label: "QA AMR per sample"
    description: QA canary - samples without an AMR gene must stay (long T1, one row per sample in T2).
    ingredients:
    - dataset_id: metadata_schema
    - dataset_id: ResFinder
    tier1: !include '1_test_data_ST22_dummy/wrangling/QA_AMR_per_sample_tier1.yaml'
    tier2: !include '1_test_data_ST22_dummy/wrangling/QA_AMR_per_sample_tier2.yaml'

  QA_ST_with_NA:
    ui_label: "QA ST with NA"
    description: QA canary - a missing sequence type must stay visible as missing.
    ingredients:
    - dataset_id: Summary_quality
    tier1: !include '1_test_data_ST22_dummy/wrangling/QA_ST_with_NA.yaml'

  QA_year_types:
    ui_label: "QA year types"
    description: QA canary - year as a number and as a label without ".0".
    ingredients:
    - dataset_id: metadata_schema
    tier1: !include '1_test_data_ST22_dummy/wrangling/QA_year_types.yaml'

  QA_L50_integer:
    ui_label: "QA L50 integer"
    description: QA canary - an integer column for threshold filters.
    ingredients:
    - dataset_id: Quast
    tier1: !include '1_test_data_ST22_dummy/wrangling/QA_L50_integer.yaml'

  QA_fanout_exhibit:
    ui_label: "QA fanout exhibit"
    description: "QA canary, EXHIBIT of a known defect - two long tables joined on one key (issue #68)."
    ingredients:
    - dataset_id: metadata_schema
    - dataset_id: ResFinder
    - dataset_id: VirulenceFinder
    tier1: !include '1_test_data_ST22_dummy/wrangling/QA_fanout_exhibit_tier1.yaml'
    tier2: !include '1_test_data_ST22_dummy/wrangling/QA_fanout_exhibit_tier2.yaml'

  QA_aggregated_no_key:
    ui_label: "QA aggregated no key"
    description: "QA canary - T2 is an aggregate without sample_id, so a sample cannot be removed from it by its ID (issue #60)."
    ingredients:
    - dataset_id: metadata_schema
    tier1: !include '1_test_data_ST22_dummy/wrangling/QA_aggregated_no_key_tier1.yaml'
    tier2: !include '1_test_data_ST22_dummy/wrangling/QA_aggregated_no_key_tier2.yaml'

  QA_population_zscore:
    ui_label: "QA population zscore"
    description: QA canary - a z-score across samples, so a sample removed before the step changes every other sample (audit placement rule).
    ingredients:
    - dataset_id: metadata_schema
    - dataset_id: Quast
    tier1: !include '1_test_data_ST22_dummy/wrangling/QA_population_zscore_tier1.yaml'
    tier2: !include '1_test_data_ST22_dummy/wrangling/QA_population_zscore_tier2.yaml'

