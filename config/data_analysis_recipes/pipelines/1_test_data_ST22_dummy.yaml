  Cat 🐱:
    ui_label: "🐱 Cat"
    description: The boss's favourite — violin plots
    plots:
      miaou: !include 1_test_data_ST22_dummy/plots/miaou.yaml

  QA Canaries:
    ui_label: "QA canaries (not for publication): each plot isolates one failure mode; the expected numbers are in its title"
    description: "QA canaries (not for publication): each plot isolates one failure mode; the expected numbers are in its title."
    plots:
      qa_amr_genes_per_sample: !include 1_test_data_ST22_dummy/plots/qa_amr_genes_per_sample.yaml
      qa_sequence_type_missing: !include 1_test_data_ST22_dummy/plots/qa_sequence_type_missing.yaml
      qa_year_label: !include 1_test_data_ST22_dummy/plots/qa_year_label.yaml
      qa_l50_integer: !include 1_test_data_ST22_dummy/plots/qa_l50_integer.yaml
      qa_facet_by_mapping: !include 1_test_data_ST22_dummy/plots/qa_facet_by_mapping.yaml
      qa_fanout_rows_per_sample: !include 1_test_data_ST22_dummy/plots/qa_fanout_rows_per_sample.yaml
      qa_aggregated_no_key: !include 1_test_data_ST22_dummy/plots/qa_aggregated_no_key.yaml
      qa_population_zscore: !include 1_test_data_ST22_dummy/plots/qa_population_zscore.yaml

plot_defaults:
  theme: theme_minimal
