# UI Persona: Developer Mode
persona_name: "developer"
persona_id: "developer"
display_name: "Workflow Developer"
logic_access: "Full"
theme_css: "config/ui/theme.css"

features:
  # Can the user interact with the Tier 3 View?
  interactivity_enabled: true
  # Does the user have access to the Developer Studio / Wrangle Studio tools?
  developer_mode_enabled: true
  wrangle_studio_enabled: true
  # Does the user have access to the Gallery Browser?
  gallery_enabled: true
  # Can the user access the Blueprint Architect (manifest IDE)?
  blueprint_enabled: true
  # Can the user edit the YAML escape hatch in Blueprint IDE? (ADR-075; depends on blueprint_enabled)
  manifest_edit_enabled: true
  # Can the user converse with the BLUEPRINT AI Agent helper? (ADR-076; depends on blueprint_enabled)
  blueprint_agent_enabled: true
  # Can the user access the Test Lab (data utilities)?
  test_lab_enabled: true
  # Comparison Theater (Phase 12-A)
  comparison_mode_enabled: true
  # Session Management visibility
  session_management_enabled: true
  # External Import helper visibility
  import_helper_enabled: true
  # Can the user access T3 sandbox (wrangling + right sidebar audit panel)?
  t3_sandbox_enabled: true
  # Can the user export results (bundle zip + scope toggle)?
  export_enabled: true
  # Can the user export the consolidated audit report (HTML/PDF/DOCX)?
  # Can the user upload replacement metadata (triggers T1 rebuild)?
  metadata_ingestion_enabled: true
  # Can the user ingest raw data files / Excel uploads?
  data_ingestion_enabled: true
  # Show/hide sidebar accordion panels
  # Show active persona name in nav header
  show_persona_badge: true

manifest_selector:
  visible: true
  fixed_manifest: null

testing_mode: true

automation:
  ghost_save:
    enabled: true
    frequency_minutes: 2

# BLUEPRINT AI Agent Helper (ADR-076). Active only when features.blueprint_agent_enabled
# is true AND the configured backend initialises successfully (auth probe, binary present).
# On any init failure the bootloader falls back to DisabledAdapter and hides the chat panel.
blueprint_agent:
  enabled: true
  backend: "claude_cli"             # claude_cli | claude_api | local | disabled
  model: "claude-opus-4-7"          # claude_api only — ignored by other backends
  api_key_env: "ANTHROPIC_API_KEY"  # claude_api only
  endpoint: null                    # local only — full URL incl. port (e.g. http://localhost:11434)
  instructions_file: "config/ui/agents/blueprint_default.md"
  gallery_awareness: false          # reserved (Phase 1 = false; see ADR-076 §9)

workspaces:
  home:
    left_sidebar: !include ../sidebars/home_standard_left.yaml
    right_sidebar: !include ../sidebars/home_standard_right.yaml
  blueprint:
    left_sidebar: !include ../sidebars/blueprint_standard_left.yaml
    right_sidebar: !include ../sidebars/blueprint_standard_right.yaml
  gallery:
    left_sidebar: !include ../sidebars/gallery_focus_left.yaml
    right_sidebar: !include ../sidebars/gallery_focus_right.yaml
  test_lab:
    left_sidebar: !include ../sidebars/testlab_standard_left.yaml
    right_sidebar: !include ../sidebars/testlab_standard_right.yaml
