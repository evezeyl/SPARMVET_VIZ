# UI Persona: Web Demo
# Pure exploration view — filters only, no export, no gallery, no ingestion.
# Persona badge hidden. Suitable for demos and public-facing presentations.
persona_name: "web-demo"
persona_id: "web-demo"
display_name: "Web Demo"
logic_access: "Basic"
theme_css: "assets/demo/web_demo.css"

features:
  interactivity_enabled: true
  developer_mode_enabled: false
  wrangle_studio_enabled: false
  gallery_enabled: false
  # Can the user access the Blueprint Architect (manifest IDE)?
  blueprint_enabled: false
  # Can the user edit the YAML escape hatch in Blueprint IDE? (ADR-075; depends on blueprint_enabled)
  manifest_edit_enabled: false
  # Can the user converse with the BLUEPRINT AI Agent helper? (ADR-076; depends on blueprint_enabled)
  blueprint_agent_enabled: false
  # Can the user access the Test Lab (data utilities)?
  test_lab_enabled: false
  comparison_mode_enabled: false
  session_management_enabled: false
  import_helper_enabled: false
  t3_sandbox_enabled: false
  export_enabled: false
  audit_report_enabled: false
  metadata_ingestion_enabled: false
  data_ingestion_enabled: false
  data_import_panel_visible: false
  show_persona_badge: false

manifest_selector:
  visible: false
  fixed_manifest: 1_test_data_ST22_dummy

testing_mode: false

automation:
  ghost_save:
    enabled: false

ui_banner:
  logo_url: "assets/demo/logo-no.svg"
  title: ""        # set to a string to show a title next to the logo
  subtitle: ""

workspaces:
  home:
    left_sidebar: !include ../sidebars/home_standard_left.yaml
    right_sidebar:
      visible: false
      panels: []
  blueprint:
    left_sidebar:
      visible: false
      panels: []
    right_sidebar:
      visible: false
      panels: []
  gallery:
    left_sidebar:
      visible: false
      panels: []
    right_sidebar:
      visible: false
      panels: []
  test_lab:
    left_sidebar:
      visible: false
      panels: []
    right_sidebar:
      visible: false
      panels: []
