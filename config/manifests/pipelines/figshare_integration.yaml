id: figshare_amr
type: pipeline
info:
  display_name: Figshare AMR Triple-Source Integration
  category: Integration Demo
  tags:
  - figshare
  - AMR
  - livestock
  - E. coli
  - demo
  description: 'Triple-source integration of AMR metadata, phenotypic resistance,
    and genotypic resistance data from Chung (2023). CC-BY 4.0. https://doi.org/10.6084/m9.figshare.21737288.v1'
  version: '1.0'

# ── Data Schemas ──────────────────────────────────────────────────────────────
# Fragment files: figshare_integration/{input_fields,wrangling,output_fields}/
data_schemas:
  fg_metadata:
    source:
      type: local_tsv
      path: ./libs/transformer/tests/data/fg_metadata.tsv
    input_fields: !include 'figshare_integration/input_fields/fg_metadata_input_fields.yaml'
    wrangling: !include 'figshare_integration/wrangling/fg_metadata_wrangling.yaml'
    output_fields: !include 'figshare_integration/output_fields/fg_metadata_output_fields.yaml'

  fg_phenotypes:
    source:
      type: local_tsv
      path: ./libs/transformer/tests/data/fg_phenotypes.tsv
    input_fields: !include 'figshare_integration/input_fields/fg_phenotypes_input_fields.yaml'
    wrangling: !include 'figshare_integration/wrangling/fg_phenotypes_wrangling.yaml'
    output_fields: !include 'figshare_integration/output_fields/fg_phenotypes_output_fields.yaml'

  fg_genotypes:
    source:
      type: local_tsv
      path: ./libs/transformer/tests/data/fg_genotypes.tsv
    input_fields: !include 'figshare_integration/input_fields/fg_genotypes_input_fields.yaml'
    wrangling: !include 'figshare_integration/wrangling/fg_genotypes_wrangling.yaml'
    output_fields: !include 'figshare_integration/output_fields/fg_genotypes_output_fields.yaml'

# ── Assembly Manifests ────────────────────────────────────────────────────────
join_manifests:
  figshare_triple_join:
    description: '3-way left join: metadata (anchor) -> phenotypes -> genotypes.
      Phenotypes expand rows per antibiotic (MIC). Genotypes expand rows per detected
      gene. The join is intentionally "long" to enable faceted visualisation.'
    ingredients:
    - dataset_id: fg_metadata
    - dataset_id: fg_phenotypes
    - dataset_id: fg_genotypes
    recipe: !include 'figshare_integration/wrangling/figshare_triple_join_recipe.yaml'

# ── Analysis Groups ───────────────────────────────────────────────────────────
# Plot specs: see figshare_integration/plots/
analysis_groups:
  AMR Integration:
    description: 🧬 AMR Phenotype × Genotype × Host Integration
    plots:
      plot_A_phenotype_bar:
        info: Phenotypic resistance distribution per antibiotic.
        spec: !include 'figshare_integration/plots/plot_A_phenotype_bar.yaml'
      plot_B_genotype_bar:
        info: Resistance gene families distribution by host animal.
        spec: !include 'figshare_integration/plots/plot_B_genotype_bar.yaml'
      plot_C_resistance_class:
        info: Resistance class distribution by host animal.
        spec: !include 'figshare_integration/plots/plot_C_resistance_class.yaml'
