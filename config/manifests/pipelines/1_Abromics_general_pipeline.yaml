# SECTION PLOTTING MANIFESTS
analysis_groups:
  MLST_Overview:
    label: "MLST Overview"
    plots:
      abromics_st_by_country:
        label: "Sequence Types by Country"
        spec:
          factory_id: bar_logic
          target_dataset: AR1_MLST_Serotype_Virulence
          x: sequence_type
          fill: country
          layers:
            - name: scale_x_discrete
              params: {}
            - name: labs
              params:
                title: "Sequence Types by Country"
                x: "Sequence Type"
                fill: "Country"
      abromics_st_by_source:
        label: "Sequence Types by Source"
        spec:
          factory_id: bar_logic
          target_dataset: AR1_MLST_Serotype_Virulence
          x: sequence_type
          fill: source
          layers:
            - name: scale_x_discrete
              params: {}
            - name: labs
              params:
                title: "Sequence Types by Source"
                x: "Sequence Type"
                fill: "Source"
# !SECTION END Plotting Manifests
