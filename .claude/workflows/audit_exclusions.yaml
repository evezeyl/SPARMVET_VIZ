# ── audit_task_drift.py ───────────────────────────────────────────────────────
task_drift:
  expected_absent_files:
    - path: "scripts/audit_code_quality.py"
      reason: >
        Intentionally deferred — rules_code_quality.md §5 explicitly states
        "Do not write this script until the implementation sprint begins."
        The task CODE-DOCS-RETROSPECTIVE references it by design before the
        file is created.
      review_trigger: "When the pre-deployment documentation sprint begins."
