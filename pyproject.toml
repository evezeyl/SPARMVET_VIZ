[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "SPARMVET_VIZ"
version = "0.1.0"
dependencies = [
    "polars>=1.0.0",
    "shiny>=1.0.0",
    "numpy>=2.0.0",
    "pandas>=2.0.0",
    "pyyaml>=6.0.0",
    "plotnine>=0.15.4,<0.16.0",
    "fastexcel>=0.11.0",
    "requests>=2.28.0",
    "jinja2>=3.0.0",
    "pyarrow>=15.0.0",
    "importlib_metadata>=6.0,<9.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=9.0.0",
    "playwright>=1.50.0",
    "pytest-playwright>=0.7.0",
    "pytest-xdist>=3.8.0",
]

[tool.pytest.ini_options]
# Pytest puts these folders first on the import path, so a run in a git worktree tests the worktree's own code and not
# the main folder's (the shared .venv has editable installs that point at the main folder). Keep one entry per
# libs/*/src; app/tests/test_imports_from_checkout.py fails when the list is incomplete or the code comes from elsewhere.
pythonpath = [
    ".",
    "libs/blueprint_arch/src",
    "libs/connector/src",
    "libs/id_reconciliation/src",
    "libs/ingestion/src",
    "libs/test_lab/src",
    "libs/transformer/src",
    "libs/utils/src",
    "libs/viz_factory/src",
    "libs/viz_gallery/src",
]

