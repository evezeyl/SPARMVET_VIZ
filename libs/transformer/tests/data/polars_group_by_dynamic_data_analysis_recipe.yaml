# Format 1 recipe of the 1:1:1 pair for polars_group_by_dynamic; data: polars_group_by_dynamic_test.tsv (sorted by d).
id: polars_group_by_dynamic
spec_version: 1
data_engine: python-polars
plot_engine: python-plotnine
info:
  label: Test pair of polars_group_by_dynamic
  description: One recipe and one data file for the action polars_group_by_dynamic (1:1:1 law,
    rules_data_engine.md section 2). Every key is written; nothing is a default.
source:
  type: local_tsv
  path: libs/transformer/tests/data/polars_group_by_dynamic_test.tsv
null_values: ['']
strip: false
input_fields:
  d:
    type: Date
    label: d
  country:
    type: String
    label: country
  f:
    type: Float64
    label: f
tier1:
  steps:
  - action: polars_group_by_dynamic
    index_column: d
    every: 1mo
    closed: left
    group_by: [country]
    named_aggs:
      isolates: pl.len()
      total: pl.col('f').sum()
tier2:
  steps: []
