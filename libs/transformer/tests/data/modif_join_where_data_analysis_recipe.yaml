# Format 1 recipe of the 1:1:1 pair for modif_join_where (two ingredients, run by the assembler).
id: modif_join_where
spec_version: 1
data_engine: python-polars
plot_engine: python-plotnine
info:
  label: Test pair of modif_join_where
  description: 'A join on conditions needs two ingredients: the left data is modif_join_where_test.tsv
    and the right data modif_join_where_test_right.tsv. Run by the assembler, not by the
    wrangler (1:1:1 law, rules_data_engine.md section 2).'
data_schemas:
  modif_join_where:
    source:
      type: local_tsv
      path: libs/transformer/tests/data/modif_join_where_test.tsv
    null_values: ['']
    strip: false
    input_fields:
      id:
        type: String
        label: id
      lo:
        type: Int64
        label: lo
      hi:
        type: Int64
        label: hi
    tier1:
      steps: []
    tier2:
      steps: []
  modif_join_where_right:
    source:
      type: local_tsv
      path: libs/transformer/tests/data/modif_join_where_test_right.tsv
    null_values: ['']
    strip: false
    input_fields:
      rid:
        type: String
        label: rid
      v:
        type: Int64
        label: v
    tier1:
      steps: []
    tier2:
      steps: []
joins:
  modif_join_where:
    ingredients:
    - dataset_id: modif_join_where
    - dataset_id: modif_join_where_right
    tier1:
      steps:
      - action: modif_join_where
        right_ingredient: modif_join_where_right
        predicates:
        - pl.col('v') >= pl.col('lo')
        - pl.col('v') <= pl.col('hi')
    tier2:
      steps: []
