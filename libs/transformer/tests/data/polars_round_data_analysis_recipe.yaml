# Format 1 recipe of the 1:1:1 pair for polars_round; data: polars_round_test.tsv.
# A TSV cannot hold a list or a struct: when the action needs one, a setup step builds it first.
id: polars_round
spec_version: 1
data_engine: python-polars
plot_engine: python-plotnine
info:
  label: Test pair of polars_round
  description: One recipe and one data file for the action polars_round (1:1:1 law,
    rules_data_engine.md section 2). Every key is written; nothing is a default.
source:
  type: local_tsv
  path: libs/transformer/tests/data/polars_round_test.tsv
null_values: ['']
strip: false
input_fields:
  x:
    type: Float64
    label: x
  y:
    type: Float64
    label: y
wrangling:
  tier1:
  - action: polars_round
    columns: [x]
    decimals: 1
  tier2: []
