# Format 1 recipe of the 1:1:1 pair for polars_str_split; data: polars_str_split_test.tsv.
# A TSV cannot hold a list or a struct: when the action needs one, a setup step builds it first.
id: polars_str_split
spec_version: 1
data_engine: python-polars
plot_engine: python-plotnine
info:
  label: Test pair of polars_str_split
  description: One recipe and one data file for the action polars_str_split (1:1:1
    law, rules_data_engine.md section 2). Every key is written; nothing is a default.
source:
  type: local_tsv
  path: libs/transformer/tests/data/polars_str_split_test.tsv
null_values: ['']
strip: false
input_fields:
  id:
    type: String
    label: id
  g:
    type: String
    label: g
  n:
    type: Int64
    label: n
  f:
    type: Float64
    label: f
  s:
    type: String
    label: s
wrangling:
  tier1:
  - action: polars_str_split
    columns: [s]
    by: ' '
    inclusive: false
  tier2: []
