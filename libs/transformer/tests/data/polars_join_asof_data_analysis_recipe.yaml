# Format 1 recipe of the 1:1:1 pair for polars_join_asof (two ingredients, run by the assembler).
id: polars_join_asof
spec_version: 1
data_engine: python-polars
plot_engine: python-plotnine
info:
  label: Test pair of polars_join_asof
  description: 'An as-of join needs two ingredients: the left data is polars_join_asof_test.tsv
    and the right data polars_join_asof_test_right.tsv, both sorted ascending on t.
    Run by the assembler, not by the wrangler (1:1:1 law, rules_data_engine.md section 2).'
data_schemas:
  polars_join_asof:
    source:
      type: local_tsv
      path: libs/transformer/tests/data/polars_join_asof_test.tsv
    null_values: ['']
    strip: false
    input_fields:
      id:
        type: String
        label: id
      site:
        type: String
        label: site
      t:
        type: Int64
        label: t
      x:
        type: Int64
        label: x
    tier1:
      steps: []
    tier2:
      steps: []
  polars_join_asof_right:
    source:
      type: local_tsv
      path: libs/transformer/tests/data/polars_join_asof_test_right.tsv
    null_values: ['']
    strip: false
    input_fields:
      site:
        type: String
        label: site
      t:
        type: Int64
        label: t
      v:
        type: Int64
        label: v
    tier1:
      steps: []
    tier2:
      steps: []
joins:
  polars_join_asof:
    ingredients:
    - dataset_id: polars_join_asof
    - dataset_id: polars_join_asof_right
    tier1:
      steps:
      - action: polars_join_asof
        right_ingredient: polars_join_asof_right
        'on': t
        by: [site]
        strategy: backward
        tolerance: 5
    tier2:
      steps: []
