# Format 1 recipe of the 1:1:1 pair for step_top_n_other; data: step_top_n_other_test.tsv.
# A TSV cannot hold a list or a struct: when the action needs one, a setup step builds it first.
id: step_top_n_other
spec_version: 1
data_engine: python-polars
plot_engine: python-plotnine
info:
  label: Test pair of step_top_n_other
  description: One recipe and one data file for the action step_top_n_other (1:1:1
    law, rules_data_engine.md section 2). Every key is written; nothing is a default.
source:
  type: local_tsv
  path: libs/transformer/tests/data/step_top_n_other_test.tsv
null_values: ['']
strip: false
input_fields:
  id:
    type: String
    label: id
  g:
    type: String
    label: g
  n:
    type: Int64
    label: n
  f:
    type: Float64
    label: f
  s:
    type: String
    label: s
wrangling:
  tier1:
  - action: step_top_n_other
    column: g
    n: 1
    other_label: other
    new_column: g_top1
  tier2: []
