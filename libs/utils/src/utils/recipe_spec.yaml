# The recipe format as data (spec section 9, D3): the checker, the migration tool and the documentation read this file.
# Cross-element rules, the registries and the engine names (utils/engines.py) stay in code. Changing a key, a requirement or the engine names changes
# `format_version`; a new term of an open vocabulary (the gallery terms) does not.
# Format 1 was amended before its first release, on 2026-11-17, by decision of Eve (D-0236): the tiers are written as their own keys
# with an optional `data_engine` and `steps` (D-0250), a plot entry holds its content directly with no `spec:` (D-0237, D-0252),
# the one app-side name is `ui_label`, on the recipe's `info`, a table, a join, an input field, a group and a plot entry (D-0253, D-0409, D-0410, D-0468;
# `ui_title` is removed everywhere), and four dead `plot_defaults` keys are removed (D-0242, D-0220). No format 2 (D-0469).
format_version: 1

# the engine names (data_engine, plot_engine) are in utils/engines.py, one place for the checker and the libraries
# required and optional keys of each element (the checker refuses any other key)
elements:
  top:
    required: [id, spec_version, data_engine, plot_engine, info, data_schemas, analysis_groups]
    optional: [entity, additional_datasets_schemas, metadata_schema, joins, plot_defaults]
  info:
    required: []
    optional: [ui_label, description, subtitle, contact, version, comment]
    free_form: true
  entity:
    required: [noun, plural, population]
    optional: []
  schema:
    required: [ui_label, source, null_values, strip, input_fields, tier1]
    optional: [description, comment, tier2, completion]
  source:
    required: [type, path]
    optional: []
    types: [local_tsv, local_parquet]
  field:
    required: [type]
    optional: [ui_label, categories, precision, scale, format, time_unit, time_zone, original_name, is_entity_id, null_values, strip]
  join:
    required: [ui_label, ingredients, tier1]
    optional: [description, comment, labels, tier2]
  group:
    required: [ui_label, plots]
    optional: [description, comment]
  # The plot entry holds its content directly (no `spec:`). Order where present: plot_engine first, ui_label,
  # description, comment, taxonomy, the content (target_dataset, mapping, layers, theme, palette, ...), then tier3 (D-0237, D-0253).
  # `target_dataset`, `mapping` and `layers` are required too; the checker reports their absence as PS02 and PS03.
  plot:
    required: [ui_label]
    optional: [plot_engine, description, comment, taxonomy, target_dataset, mapping, layers,
               theme, facet_by, palette, labels, guides, filters, tier3]
    # The keys of the entry that belong to the app, not to the plot content: the plot library takes the other keys of the
    # entry as the content of the plot and ignores these (it still refuses a key that is on neither list).
    entry_keys: [plot_engine, ui_label, description, comment, taxonomy, tier3]
  # one tier of a table, of a join, or tier3 of a plot entry: the key of the tier holds this mapping (D-0250)
  # PROVISIONAL (piece C-1, D-0332): an AUDIT recipe (profile `audit`) also holds a second list, `audit_steps`, in a tier, and `audit_comment` on each
  # of its steps. They are NOT listed here: they are legal in the audit profile only, are judged by the checker (`AU01` to `AU04`) and are named in code
  # (`utils.recipe_tiers.AUDIT_STEPS`, `AUDIT_COMMENT`), so a recipe of any other profile is checked exactly as before and `format_version` is unchanged.
  # Whether these keys change the format version is a question to the owner (see the report of piece C-1).
  tier:
    required: [steps]
    optional: [data_engine]
  plot_defaults:
    required: []
    optional: [palette, theme, layers, random_state]
  layer:
    required: [name]
    optional: [params, comment]
  tiers:
    schema: [tier1, tier2]
    join: [tier1, tier2]
    plot: [tier3]

# the engine of what a step or a component belongs to comes from the registries (`engine` of each entry, D-0238) and is given to
# the checker in its catalogues (`action_engines`, `component_engines`); the names of the engines are in utils/engines.py

reserved_schema_ids: [metadata_schema]

# The completion of the ids (D-0572 to D-0599, D-0613, and the owner's words of 2026-11-24; PROVISIONAL form, an agent's choice, built 2026-11-24). A table of
# `data_schemas` or the metadata table that declares an entity id (`is_entity_id`) states in its `completion` block what a line added for an entity id it lacks
# means; the app adds those lines when it reads the files (`utils.id_completion`). `marker` is the name of the yes/no column the app adds (true on an added
# line); by convention it is `<table>_not_in_original_data` (the table's id, then the suffix below; the metadata table is `metadata_schema`), and the check does not
# enforce that pattern: it only needs a column name that no field of the table has and that no other table uses (E06: a join of two tables would hold two
# columns of one name). `meaning` is a free sentence written by the recipe maker, specific to the table: what an added line means for THIS table; the check refuses
# a missing or blank sentence (E05) and does not judge the content. The block is required where an entity id is declared (E04) and refused where nothing is
# completed (E07). A table of `additional_datasets_schemas` is never completed. The key is NOT a change of `format_version`: format 1 was amended before its
# first release (D-0469).
completion:
  keys: [marker, meaning]
  marker_pattern: "[A-Za-z][A-Za-z0-9_]*"
  marker_suffix: not_in_original_data
  # the app's own fixed words for an added line (in the log, the export and the warning), whatever the recipe maker writes in `meaning`
  added_line_words: missing in original table
  # the sentence that generators (the factory, the bootstrapper, the scaffolder) and the shipped recipes write where the recipe maker has not said what an added
  # line means: it is true and it claims nothing; the recipe maker replaces it with what the line means for the table
  starting_meaning: "Not yet stated by the recipe maker: an added line only says that this entity has no line in this table."

# old key -> what to write now (check messages and the migration tool read this; spec section 12)
renamed:
  top:
    plots: "move each plot into a group of analysis_groups"
    wrangling: "put wrangling inside a schema of data_schemas"
    input_fields: "put input_fields inside a schema of data_schemas"
    output_fields: "removed: end the step list of a schema or join with a polars_select step"
    final_contract: "removed: end the step list of the join with a polars_select step and write display names in labels"
    name: "info.ui_label"
    pipeline_id: "id"
    description: "info.description"
    metadata: "metadata_schema"
    type: "removed: describe the recipe under info"
    join_manifests: "joins"
  info:
    display_name: "ui_label"
    label: "ui_label (the recipe's one name: the HOME banner and the lists show it; D-0410)"
    name: "ui_label (the recipe's one name: the HOME banner and the lists show it; D-0410)"
    ui_title: "ui_label for the name; a longer text goes in description, shown in the Info panel (D-0410)"
  schema:
    label: "ui_label"
    info: "removed: write description (what the table is) and comment (why) on the schema"
    fields: "input_fields"
    id: "removed: the key of the schema is its id"
    output_fields: "removed: end the step list with a polars_select step"
    category: "removed"
    sub_category: "removed"
    comments: "comment"
  field:
    label: "ui_label"
    is_primary_key: "is_entity_id"
    is_entity_key: "is_entity_id"
    source_name: "original_name"
  join:
    label: "ui_label"
    info: "description"
    output_fields: "end steps.tier1 with a polars_select step; display names go in labels"
    final_contract: "end steps.tier1 with a polars_select step; display names go in labels"
    recipe: "steps"
  group:
    label: "renamed ui_label (the short name of the tab, of the lists and of the report)"
    ui_title: "removed: the report uses ui_label, the same name as the tab (D-0409); a longer text goes in description"
  plot:
    info: "description"
    label: "renamed ui_label (the short name of the tab, of the lists and of the report)"
    ui_title: "removed: the report uses ui_label, the same name as the tab (D-0409); the figure title is written in a labs layer (its title argument)"
    family: "taxonomy on the plot entry"
    pattern: "taxonomy on the plot entry"
    difficulty: "taxonomy on the plot entry"
    facet_scales: "a facet_wrap layer"
    labs: "a labs layer"
    coordinate_flip: "a coord_flip layer"
  plot_defaults:
    height: "removed"
    show_legend: "removed"

# Old shapes of format 1 before the amendment of 2026-11-17. The checker refuses each with the key, where to write it now, and the
# rewrite tool (a key listed here is refused whichever element holds it).
old_shapes:
  tool: assets/scripts/migrate_recipe_engine_keys.py
  schema:
    wrangling: "write tier1 (and tier2) directly in the table, each as a mapping with steps: [...] (and an optional data_engine); there is no wrangling key now"
  join:
    steps: "write tier1 (and tier2) directly in the join, each as a mapping with steps: [...] (and an optional data_engine); there is no steps container now"
  plot:
    spec: "write the content of the plot (target_dataset, mapping, layers, theme, palette, ...) directly in the plot entry; there is no spec key now"
    steps: "write tier3 directly in the plot entry as a mapping with steps: [...]; there is no steps container now"
    title: "removed from the plot (D-0253): write the figure title in a labs layer (its title argument); the name used by the report is ui_label"

# Tombstones of removed keys (rules_legacy_management.md section 2c): a key that did nothing was dead code and is removed from the
# structure (D-0220); the checker refuses it with this text. "expires" is a distance, not a phase number: the removal task is made
# when this is merged.
removed:
  plot_defaults:
    default_font_family:
      decision: D-0242
      date: "2026-11-17"
      why: "The font, like the text size, is set through a theme layer"
    facet_panel_spacing:
      decision: D-0242
      date: "2026-11-17"
      why: "The spacing of the panels is set through a theme layer"
    legend_position:
      decision: D-0242
      date: "2026-11-17"
      why: "The position of the legend is set through a theme layer"
    optimisation:
      decision: D-0242
      date: "2026-11-17"
      why: "The automatic adjustment of the axis text has no switch of its own: an author overrides it for an axis with an element_text layer"
  tombstone_expires: "two phases after this change is merged (delete the text then; the removal task is made with the merge)"

# old field type names -> the replacement (spec 7.4). The migration writes the first word; `categorical` was cast to Categorical after reading.
renamed_types:
  categorical: "Categorical"
  utf8: "String"
  string: "String"
  character: "String"
  numeric: "Float64"
  float: "Float64"
  integer: "Int64"
  int: "Int64"
  i64: "Int64"
  date: "Date"
  bool: "Boolean"
  boolean: "Boolean"

# what the checker and the reader suggest for an old word that has more than one good replacement (Eve, 2026-11-15)
type_suggestions:
  categorical:
    - "Suggestion: write `String` for a category with no order (the levels are then drawn in alphabetical order)."
    - "Suggestion: write `Enum` with `categories:` in the order you want when the order has a meaning."
    - "`Categorical` is also accepted (the levels then follow the order of the rows in the file)."

# the vocabulary of the gallery taxonomy (spec section 9); open: a new term does not change format_version
gallery:
  axes: [family, pattern, difficulty, show, sample_size]
  terms:
    family: [Comparison, Correlation, Distribution, Evolution, Part-to-Whole, Ranking]
    pattern:
      - 1 Numeric
      - 1 Numeric, 1 Categorical
      - 1 Numeric, 2 Categorical
      - 1 Numeric, 2 Categorical (Faceted)
      - 2 Numeric
      - 2 Numeric, 1 Categorical
      - 2 Numeric, 1 Categorical (Faceted)
      - 3 Numeric (Matrix)
      - 1 Year, 1 Numeric
      - 1 Year, 1 Numeric, 1 Categorical
    difficulty: [Simple, Intermediate, Advanced]
    show: [change, distribution, frequency, normality, proportion, ranking, relationship, trend, uncertainty]
    sample_size: [any, individual points, medium+, large]
  # how the filter panels and the tag strip of example_meta.md show the axes, in this order (label and icon in one
  # place, finding G1); `geom` is not typed in a recipe: it is the first geom_ or stat_ layer of the plot
  display:
    - {axis: family, label: Family (Purpose), icon: "📊"}
    - {axis: pattern, label: Data Pattern, icon: "🔢"}
    - {axis: difficulty, label: Difficulty, icon: "📈"}
    - {axis: geom, label: Primary Geom, icon: "⚙️"}
    - {axis: show, label: What it Shows, icon: "🎯"}
    - {axis: sample_size, label: Sample Size, icon: "📏"}
  companion_files: [example_data.tsv, example_meta.md, preview_plot.png]
