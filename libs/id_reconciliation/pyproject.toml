[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "id_reconciliation"
version = "0.1.0"
description = "SPARMVET_VIZ ID reconciliation library — headless, Shiny-free"
dependencies = [
    "polars>=1.0",
    "utils",
    "rapidfuzz",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
]

[tool.setuptools.packages.find]
where = ["src"]
