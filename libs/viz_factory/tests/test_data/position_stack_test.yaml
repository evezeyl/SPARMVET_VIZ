id: position_stack_test
description: Test data analysis recipe for position_stack_test.yaml
input_fields: []
wrangling:
  tier1: []
output_fields: []
data_path: ./position_test_data.tsv
plots:
  stack_plot:
    comparison: true
    comparison_baseline: dodge
    mapping:
      x: x
      y: y
      fill: group
      color: subgroup
    layers:
    - name: geom_bar
      params:
        stat: identity
        width: 0.8
    - name: position_stack
    - name: theme_bw
      params:
        base_size: 14
