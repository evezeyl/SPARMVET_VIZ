[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ingestion"
version = "0.1.0"
description = "SPARMVET_VIZ ingestion library"
dependencies = [
    "polars>=1.0.0",
    "pyyaml>=6.0.0",
    "fastexcel>=0.11.0",
    "utils",
]

[tool.setuptools.packages.find]
where = ["src"]
